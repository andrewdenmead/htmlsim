<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nordhavn: The Meridian Deal — SimLearn</title>
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFEA; --line:#D3D8D1;
  --pine:#2F5D50; --pine-2:#24493F; --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .right{display:flex;align-items:center;gap:10px;flex:none}
.teacher{font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}
</style>
</head>

<script id="scenario" type="application/json">{"id":"nordhavn","version":1,"title":"Nordhavn: The Meridian Deal","org":"Nordhavn","level":"C1","disclaimer":"All companies, people, and figures in this scenario are fictional, created for language-learning purposes only.","context":{"text":"Nordhavn has spent six years building a coffee company that looks nothing like a coffee company. Free machines in office kitchens, a rotating weekly delivery of beans roasted three days earlier at most, and a marketing voice that never lets anyone forget where the coffee comes from: three named partner farms, paid well above the usual floor, no traders in between. The founders appear in their own adverts standing next to the farmers by name. It has worked. Now Meridian Partners, a global strategy consultancy opening five new offices across Northern and Central Europe, wants Nordhavn as its single coffee supplier for all of them — Copenhagen, Berlin, Warsaw, Amsterdam and Stockholm, one contract, all at once. It is the kind of deal that changes a company's size overnight, and Nordhavn badly needs it to: the same six weeks Meridian has set aside for its launch events are the six weeks in which Nordhavn's own investors expect to see a signed, marquee client before they will close the funding round keeping the company solvent. The problem underneath the celebration is arithmetic. Three small farms, paid a premium that only works at a small farm's volume, cannot supply five cities' worth of consultants by a deadline set by someone else's press calendar — not without help from somewhere, and not without someone deciding what kind of help is still honest. The team has six weeks to work out what it is actually willing to do to survive this win.","scar":{"label":"The Fjordvej Listing","text":"Two years ago, Nordhavn signed a national listing with the Fjordvej supermarket chain and quietly blended supermarket-shelf volume from an uncertified bulk trader into its direct-trade line to make the numbers work — still labelling it single-origin, direct trade, on the shelf. A customer ran her own informal supply-chain check for a university project, found the mismatch, and posted it online; the story cost Nordhavn the Fjordvej contract, a public apology, and months of rebuilding trust."},"proof":{"label":"The Basala Walk-Away","text":"A year later, a much larger retail chain, Basala, offered Nordhavn a similar volume deal at a price that only worked by cutting the farmers' premium. Nordhavn said no, in public, posting the actual numbers and explaining exactly why the deal didn't add up for the farms. The post was shared widely, sales rose for months afterwards, and two later office clients cited it directly as the reason they signed."},"constraint":"Meridian's launch events across all five cities begin six weeks from now, and Nordhavn's own funding round — needed to keep the company solvent — is set to close that same week, contingent on Meridian appearing as a signed client."},"listening":{"name":"The Long Pour","questions":[{"q":"The podcast says vetting a brand-new direct-trade farm partnership usually takes about:","options":{"A":"Eight months","B":"Two weeks","C":"One year"}},{"q":"Since 2019, how has the number of consultancies mentioning 'sustainability perks' in job ads changed?","options":{"A":"Stayed flat","B":"Slightly increased","C":"More than tripled"}},{"q":"Which term, the podcast notes, is NOT independently audited the way 'Fairtrade Certified' is?","options":{"A":"Direct trade","B":"Organic label","C":"Union certified"}},{"q":"Compared to certified direct-trade prices, trader-bought commodity beans cost roughly:","options":{"A":"The same","B":"Half as much","C":"Twice as much"}},{"q":"The sourcing consultant on the show describes companies' 'ethical pivots' as:","options":{"A":"Marketing genius","B":"Reputation insurance","C":"Pure greenwashing"}},{"q":"What share of scaling coffee companies say they struggle to keep sourcing standards consistent?","options":{"A":"About 20%","B":"Nearly all","C":"About 60%"}},{"q":"The direct-trade movement partly emerged as a response to:","options":{"A":"New EU regulation","B":"1990s income crash","C":"A caffeine shortage"}},{"q":"Some brands avoid blending their sourcing story by:","options":{"A":"Running two tiers","B":"Hiding all data","C":"Dropping direct trade"}},{"q":"On average, how long does a brand take to recover sales after an exposed sourcing scandal?","options":{"A":"About a month","B":"About 14 months","C":"It never recovers"}},{"q":"Buying through a bulk trader instead of a direct relationship mainly trades what for speed?","options":{"A":"Higher cost","B":"Better quality","C":"Supply-chain visibility"}}]},"roles":[{"id":"A","label":"Role A","dept":"Farmer Relations","characters":[{"id":"freja","name":"Freja Holt","title":"Sourcing & Farmer Relations Manager","subject":"Before you get too excited about Meridian","email":"Hi,\n\nI know everyone's celebrating the Meridian news, so I hate being the one to say this, but someone has to: the numbers don't work yet. Meridian wants enough coffee for five offices, delivered on their launch schedule. Right now we buy everything from three farms, including Beatrice's cooperative in Rwanda. Between the three of them, at full harvest capacity, we can supply maybe a quarter of what Meridian is asking for. That's not a rounding error. That's the whole plan not fitting the numbers.\n\nI know Anders is already looking at outside suppliers to close the gap, which I understand, but I want it on record that I haven't agreed to anything that changes what we pay our three farms. That part isn't up for renegotiation as far as I'm concerned, not without a much harder conversation first.\n\nWhat I can't tell you is whether Meridian's number is really as fixed as it looks — that's their side, not mine. I can give you one more thing before you decide. Choose carefully.\n\nFreja","offers":[{"id":"o1","title":"What 'full harvest capacity' really means","text":"+paSGD2x2CWQJcN8eVsR0MIbTQgQOe2Y05ymfn6hwJCimcrlijM1qAwawRIkc6T81oJ+vf+evRm7dpRNB0ygct+2nXF8H7JPWjvcpZA/irXV5mQDPEeNz8ylGU2t5arMpJQAyLMRetOvdTtpT1lcY2onRHhOqXZKan3WaKV35nAPyRwIG9E5F42SKdkW+QjfxhFWNngZvlKXu0udR+QNck89H+9Oq05I0YyOvh7YFgPvWxfr6Jh3B+fI8vf7aOsfP8tCuAeObxurU24g2BVoyX+qh1m+qv3iQPH1dQrAg8f9Wz9p2RDHOOZeeSh0Oet0kvwrabH6R6ZMAEy71YKAqMqMdVGt3uV33ikHd1WfQxQ+6rlVkKh1nf9QUCFwWwFGuQW5OAREow=="},{"id":"o2","title":"How the three farm partnerships began","text":"fjlSdfLyHzaNvyYrcXkjOB/KN4dtjAagradcMpyTQt1OadWFFN1yBTW6dZHyGyKQ6kKpgpes105S1vMeW6TOJz2Pv+6Vvh3JY3i5NJS+i2vohz6qtQKzQn6PtcHycwPqboMq6GyHqXnYkchf3MlPEPMYw6jAO4lQQFoZ/Yqn5Rz7pOUqxhYJueAXydO46x9OG45Oxs4vpzye2Yl3IRbq6D8rysTq7+UulOk0jR41SY4vd4q1aCbJyeeAO5NBpdLO00wmC/T/QiEadYVAFkkQHzCEKFwSJeyBmuXojc5Do9YBR/g0Vi2Cbsx1wQM8VHjnwzOyrGfY9xQunfs/2m3JuojqUqI7A/EH+oHFGcaH9nidosk="},{"id":"o3","title":"What our farms could cover, and when","text":"ICYRXvBW+mIQ8pnuLhh/f6YMkIEIjiRS1sQq3dCZaIT02hxt9T6qFxA0pHuxRsdWq3XvLSDHdpydquuBXlwsMMX40aTHtl4r2PDpnu97dovHgRkKOYdYZFwZbXCwXqhflOR32M1A0sSEPzi03TV3gMjXbQYs+/HidwIPrrXb3aSGdLIQAutWJpF3G+rDlF1nEGy1PwQ2H/NSLpqx4G8w6RKJXI+nJAdLsov5QWu3s4pSlf8SckATTAaRkzMUtNUJ/FdvfLbC/METDWgW5I6zkEIDVteIKbTGnug3uweP+Mon1kOgmSp7G0NH7Pcn/9H2zEeJGf/z9is1DdNaBYZkWdkEwoQupFrgYXGd358eJROyneb7niGvYS6Fj7QLhS5h3+/lLM/guFgaP2m0/kyw8vynsLJmukteCZ9+8f3G/GdfEBJIobUM/ElNjUVUS7ilhJ0="}]},{"id":"beatrice","name":"Beatrice Uwase","title":"Cooperative Leader, Nyaruguru Hills Cooperative, Rwanda","subject":"Good news? (asking honestly)","email":"Dear friend,\n\nWord travels fast even here — one of the other cooperatives we trade seeds with mentioned that Nordhavn might be talking to a big new buyer, a large company opening offices across Europe. I want to be happy for you, and mostly I am. But I heard something else alongside it, secondhand, that I can't quite let go of: that Nordhavn has also been talking to a trader about bringing in coffee from somewhere else, outside our three farms, to cover a shortfall.\n\nNobody has told me this officially. Maybe it isn't true, or maybe it's smaller than it sounds. But you know what our agreement means here — the price above the usual rate is not just numbers, it is the school roof we finished last year and the clinic visits we can now afford. If anything is changing about how much Nordhavn pays us, I would rather hear it from you directly than piece it together from rumours.\n\nI can tell you one more thing before you decide. Please choose carefully.\n\nBeatrice","offers":[{"id":"o1","title":"What a lower price would mean for us all","text":"HBdF++ZaZ98V4RUfWZF6m5CRZv5XjSwoqwDamd8uMde2whaupYbRNix1a5R+qavcVR5XZT3nvBLcKrA9WJWrC/x52xffMaWaO6uKhsGQNHNeo50wfKUj3aoNZIPpOLSpGCitqa6DagcPlyOSfBTyShaeDyIiaFJybEsiV3kZ/iGdRY/v6fJOPCUM5hZZ92qSiykDue8u1KXe70zwf8RtqW1uFfZj43EdhaIXHpym5wIWYl8fXTLDTlMhE6CRJ23WP6phKHqZNSOd9O0eYHsxrzZ2km6tAa51p8aQ8FEyXv5te5ukiGkN5KM9lxE7BTm7OOxLyB4PPA/OThRRHo2lMckRKphRWXZE4Dn+PvmejCMt8cFM7SZq5sOuUVhub68ZvqBAhA6T1sKXMjjt5UY59M0cbUka/hyY4NlyN1AgoKVmgLTSevamvugp92DYBYG3TEB9rzTR5jWU"},{"id":"o2","title":"What the premium has paid for so far","text":"9ckeeSKRgZ6IgJa/luCjqEmsQKK93AMqBi13CWLCiXvB1gvzF4GFqCEtI0chZNIUFsdzkXCRaRPOISn+TZVfZUvij29RgK64pQlpd32BjRXTPyTRJa+wUazQmPWSNHAPQ0Br8QOvDF+UXhyd7P/zv5XWYthqRqlhHGcEAwPMD5tUPGkvl656hrRbHiTUMqCx8hLXriyVKE0zsymNFG39itRjAfmPVf32Zk95cqaPHSdjj5Dlz7/UueuiIlRtwmoQ4FNvn/I1vFnUOQfz1R/5B3UNSsiZzhm7FugGpDRslE0iiXCpiQbv+6aFURrLPMao8wZN9lTcDolQ2QZlnBmUV1JI1vL2PWLp9vjc2MNPpQl1feW4nBaeaAZSftn3422MuDhKCKmY2yFZkVpyc0tgyzWASNbfWg=="},{"id":"o3","title":"What this year's harvest could bring","text":"IYhri+WEF8ihvDFYWpbqOP8B4sllgXpez9F1ij3i3OmZNw7t/P8BsPwpQs6cbIrT0oA4RPLVITvk/MV+UUvBhDS6SkMr0p8t203/wC7qYKJrzBzMre/g+qBvjQZWPOulX/5MN7klws/Vjo8M8hFDNpJam28ibKVwb5NObW1lTyCrKIlhqzPQFtlh/0fSmwyCkVYumbwGHO8rd6RF2D99sqf4Z8T/OApcJly8gooagNLLBSxusq2FpWuc18BVb3EzzP4+RU+GeCsLXiXkbgC7P+E4SInFTvdsPIQ3fRf+OqY1469A5u8I9xmSk4LymlY7PCBXllcjHFyOdCk1kprAPzo="}]},{"id":"mikkel","name":"Mikkel Aabo","title":"CFO","subject":"Numbers on Meridian — not as clean as they look","email":"Hi team,\n\nCongratulations on Meridian, genuinely. But I want to flag something before we get too far ahead of ourselves, because it affects everything downstream, including the funding round.\n\nI've run the model at Meridian's requested volume, keeping the farms' pay exactly where it is. At that price, on that volume, our margin on this contract is close to zero, maybe even negative once you account for the extra logistics across five countries. That's before I even factor in anything Anders is exploring on the supply side. If we keep farmer pay untouched and still hit the volume Meridian wants, this deal doesn't fund anything. It might actually be a net cost dressed up as a win.\n\nI'm not saying change the farmer pay — that's not my call to make alone, and I know what it means to people. I'm saying the board and our investors need to see real numbers, not the version of this deal that sounds good in a pitch.\n\nTo be fair to the deal: if we started with fewer offices, the margin would be thin but positive — the losses come from the five-country logistics. What I don't know is exactly what our investors have already been told about this deal — that story isn't in my spreadsheets. I can give you one more piece of the picture. Choose well.\n\nMikkel","offers":[{"id":"o1","title":"Where the margin on this contract goes","text":"m1RoTnLNFAth+dXa1H63zK4zljE9iL/BmHdvXXhSFy1qdNimTHmSIcadz8b6UUaCRH1cvpR5kZNa738kH9L6863+nTjYZk5aqY4H5zSl7JO+9KUeqlQzR9jT+ufn9s0usLp3y7s9JKow54O7g0v8EwG8TKZb6AIPaU6J/NAbCZhGsnv/VkM9n+pHj+VF0eSbkywfgGcVYNKg/uLMp4qILqpdpKYA0kYXEgy9q4vMqZY7EOKejVlSwVa7KwMtp3o1VprbyQi3o24xCRAbFgSv+JGs5E0MGrJUUPzWYBVkAc/LqzNYg7t4Y++lksv/NCtr1y7klUEfX7jhRTEYflH7YHKnp/J0zfELNrCvLl9dZOt1zxyov4nQgw=="},{"id":"o2","title":"How much risk we can really take","text":"JArONJ257nyQc0A3CVhS9NmMGruJj8rJ5G7P4jV0gN0hVORFHNINVnYjadfZX3fSLzrazSWwNBcEVTaCd3TgSCxZFIuHuwYbjAGRD8Kmlfkv7qB9p6oPFDPdJo ocurement. I can give you one more thing before you decide — choose carefully.\n\nAnders","offers":[{"id":"o1","title":"Whether the bridge is worth the risk","text":"j0rhOCn5Ccw9wnKvNqfrkpPjiqp7jn6MMnSJF11bapsdIpH6yHY8tRbk3BBSG7K+/KZjJaxUv9euzrhMF5bQwa44DYV8mR1d8IbHYqskrE3q8wj+16kltyT4xOSFH61sz8smg2QPbxVsUpk/kRFxZTlw1JSItF6iyB52Qy/3Up7PQRWGSW3cLREchxFh33jGIfLoFXIgB5ANnGiqVwBvYoiOHjXNH5iuW1/HpDNjjSzvgbzKP7F0gK/NkX6Bbx+YnpVtohSqONwJ9feYDqyhuw2os06ttv9Wxq9dJ0wd6sJUXLNzqKXTQVHE7kA8xBE9yRTR754nLU1N+A+Lp9MY8MCbb/N4ZyqrCO5LHhact1/Ms0HrqixY1xDayAmIsu7GQuyNxhB9DSHaSqwEyvTZu/xdSS13f3nPxSCi"},{"id":"o2","title":"What Radek's beans would cost us","text":"EUDA6nlsMqYulJqQLUbIzgmqPOeR9MslHv48OEY7Rq/h8oU5vV0SVEEBEjwbVz51HYzguERjgOmy/OlaFSdsfnAMt8fOQCY7wh2iihmA/WS/bAXVUwrcExjtWt8SGjDtfGxfRX7hdZ3a1lSVHpwZHu8lqa8/U5QZbjVSfUv2qZjo67DmWQ0TaawejP99JyYKt3oIdkBbhJRI4Uqvc11Q0J8QS/MZHqVzuTaXC/84MErbxnruqXrVwYKvNV3SmUFjA5I1YcBICvn78Jj2JbQP6CoHYaPLF63ZsH2wfYKqwiMjxXqnqau3ZTgFSXlTV0qTZ3lJOg=="},{"id":"o3","title":"How proper vetting works, step by step","text":"TIp9RvNm/atg/InKtK+FK0eilAanK6aSfWHoRY83lagVFa2PITDyxGtdP/WWZKut9tp1PxYN3z2RZ3k2u0h0cgAMuq9XRna9FpPkoY7ebnZysNOpBG1EP5sKh1plnTICb35LMbJlsCWw5FpdIUO52PQWU3z3OvMIrCmw4fGQ5znfHjMF4b5pTcUhOi+9j4BE62DNSfg2sbVeN34xjp9e3TZnku3XlY1NeG5mNHPsAFHFzOnRF97deBLMWIpbCTWFnsFL77ViFw5/dadvYLJky+yhLRawv2odK9KjzoBXkOLwYw+L9BDTdJnPknHoTcaS7mpiI/jDGUlMgo0="}]},{"id":"radek","name":"Radek Nowak","title":"Trading Director, Baltic Bean Trading","subject":"Re: Volume for Nordhavn — can move fast","email":"Anders,\n\nGood to talk earlier. As discussed, yes, we can cover the volume you mentioned, and quickly. We work with a wide network of growing operations across a few origin countries, larger scale than your usual farms, and we hold enough stock and pipeline to get you moving within days rather than months.\n\nOn price: it's considerably below what you're currently paying your direct partners. That's the nature of buying through a trading desk rather than direct relationships. You're paying for the network and the speed, not for a story about any individual farm.\n\nYou asked me directly about labour conditions on the farms we source from. I'll be honest: I don't personally audit individual farms, and at our scale, most buyers don't ask that question as specifically as you just did. I can tell you the operations we work with meet the legal minimums in their countries. Beyond that, I can't give you a guarantee. That's just not how this end of the business works.\n\nI can tell you one more thing if it helps you decide. Choose what you need.\n\nRadek","offers":[{"id":"o1","title":"What I'd need from you this week","text":"Fx7SGxOAdA4VO3kaNBJ0xlUlg9JL28COTzIbiaqq6kcehYMLojFXYcbviYxY9NDfoJYWGTjuikd6QH7u6ToBrdlh0DK9o9I2bmDyhkqH97o9lJu6vqvwoHskjUvlcyRP5p1OOG5pRNNDwrspyR5TalBXY0hwCPf1+JMlHDzvGHRfJj3NkVsfRD5MJgp8pf5UMuD/BllvNwFE2Yjqv/tKGvjDp81J84jvnPUTZxYXq5aV9DZL1W6uSjj2o2qqwRsg9xgQ9AcHyCpf7E3Yt5VCfWnA4cw6xUQeqjQ="},{"id":"o2","title":"The honest limits of my supply chain","text":"rEgJ/qaxsuFDIdlevsqZSei6BMpNFA9u3MgoLRV7ZROfY4QQct0Gqdz19LR0E5evLSsgEaUtFiLY5FxsSc5pM+8pe4jzLAnAaXdv1in+4BTkxNHhCdGq0yal8wqz7pMoEy6YV3bZflwcPnEMWpqedDOzBKYwb3yY1NNDc2WmQWib4rxjZol8eZqND8xjexjWHqdqD/l/U9dMV5zbrmRhTLqZaTb3l7e4XSYSDFpiiXzyi9JDmBR3BMcOr83LneBnCqzSVcW4wUhmpEdNPNNhXCBFpkHtnhhnIH7T2hz1dhbnRPYiPaLcB7n4Dg07CXA1KrKHTyvioTJtUQEyk0xTa07epvqFDVnAeY+vFbYyOYjxXsm+"},{"id":"o3","title":"How a trading desk actually works","text":"QLyzo2f+iaaOhUUmSENgNvHIDpIsgP9KkIzLNUrnYmPhYdoX7k/I62N4x+RlY+9mtlXaNJi/lPjaXXlL12p4ZSmo7m3HQp1JRyVToKIpf6n6KIvdkaRaK5aa6e/7Pwo3cbA97zU1oocLFFXZeztH6w/vgTv7l+Mkj7g0qDlqI6dgyrPDh+iWRC51Z5nAxcbgZI90J4/P0lIsm0TZof6PP0rAOFr2UqUAjqKMz1QhqUmp72IO9k2uSyOhEpQgLQLc5f0BZ2CAJjppQJlze8LHN20RJowiVHKno9rilim9bP6CgixeEA=="}]},{"id":"camille","name":"Camille Duval","title":"Global Procurement Lead, Meridian Partners","subject":"Excited to get started — a few practical questions","email":"Hi,\n\nWe're genuinely thrilled about this partnership — the team keeps mentioning how much better the coffee story is than what we had at our old offices. A few practical things from my side as we get moving.\n\nThe volume figure in the draft agreement, enough for roughly 400 staff across five offices, came from our standard internal formula for a rollout this size. I'll be honest: it wasn't built around your specific supply chain, it's just the number our procurement template produces. It's what I put forward internally, and unless someone tells me otherwise, it's what our launch planning is currently assuming.\n\nOur launch events are locked for six weeks from now. That part really isn't flexible — it's tied to press and leadership travel that's already booked. But the exact volume ramping up gradually rather than all at once on day one? That's genuinely a conversation I could have internally, if there's a good operational reason and I hear about it early enough to build it into the plan.\n\nWhat I don't know is what your three partner farms can actually deliver on this timeline. I can tell you one more thing from our side before you decide. Choose carefully.\n\nCamille","offers":[{"id":"o1","title":"Why Meridian chose Nordhavn","text":"eKx8YOmPjuRQH2Acrdklgu6inq1SDdxasU9dfuSAlK3VjD3/JgZuMBV3tR6hJ0PqRzWH/lvjfG+P+kB4qYXd4e0pI5t69dxeo19kAeHQ4OWI00Jt0t9ZZMsUiN+oCWQTr2f/K7n7FYZs8DXMuKffTm0pGJNW9y/TLlK2GEG+oxjrj+VN8jcvPkfMk8XkBF+DdZi/VmiVIYtOQFcdlQ0gbG/E7HSIXQ4F1L1duEaLNqXuKpaN41u6RlpTzwsWBDxvmKC2SZjDuCH1SwARX0sgpmwmDZYVpWgiahYVrtVSn8ORbQ2P7Wth5+53lwGJFwMYHhbZuMZCcV9bqGIpXMgJ1Uj71XP3huNLmAOT"},{"id":"o2","title":"What the launch events will look like","text":"t51LjvJCv7QKZienC1liuqE8hJ8jt1yu1tKiKsUnrIMI/rrQ7xfSjjnYlWgxZCoFGouWfBoMBFORq/F9PjaY92dkJs6xlWhDw/mj3FkqWwJJbJ1BlwmKjpfVtunB3caHt3769YEACVEGyC3e6NZu58fRdXlJiQwbSjp0/uWW+FaZyu+OpLFdq1ZPtWWGwVevmiWYCNTuh/0EgPhdkQ0Ep6CvUL8/bOoKnvizCMxS1+FbW7WmAXcMvahpCB1FLmfhw/zcIfEc6IjczQo3tqdCKjoAupef3YkcyQfW+H+2VyDVvjnIztmw+oxCAnAl"},{"id":"o3","title":"What our leadership could live with","text":"pUTOKWMikqvcWVIO25pB66bCooBCnO6zWrR7D65JvLawyFkjmg5590GqZhWtfMcrwY/QPRb+QneT/iUxQN7+iAdGbbjzwX68Wr0dg58m+eYDsGYU7cAHwoG2lmwmHReVBbJg46FIG4KZxY4130RjEYVtwcoOgFXZOjGQOwdycvUmws0PXSD3rNBmbVAUXHSgtPqyrRZ/+8zpm5PFwnKE620BzIxy40HnOTNHZ8uKqp1CpDdi6GL/1fSIT53o4FIVV2mCgPjV6ox+EJKl19KzV3finbb0JOSutTjbZlAr4Z1udNEoRqYGoLqYl2viaojQmUgRoubyoH8/0VJwLwwOjXxksNn1dffKQ3O/mJF3vfHNuVR6iDlic/t2xHy7aGHp2N6M7bWsDN54KbegyOdjz9ZuxEhIONvUp8zo/hIL4KY="}]}]},{"id":"C","label":"Role C","dept":"Marketing & Communications","characters":[{"id":"ida","name":"Ida Holm","title":"Head of Communications","subject":"A journalist just emailed me about Meridian","email":"Hi everyone,\n\nSmall heads-up that might matter more than it looks. A journalist who covers ethical business, and covered our Basala story favourably last year, has emailed asking for comment on \"rumours of a major new corporate partnership.\" I don't think anyone leaked anything specific — Meridian's own comms people have been talking about opening new offices, and someone probably connected the dots. But it means eyes are already on this before we've said a word publicly.\n\nOur usual approach with big news is to go loud and specific fast, in our own voice, before anyone else gets to frame the story for us. That's basically worked every time so far, including with Basala. My instinct is to do exactly that again here. But I want to be honest that I don't yet know all the details of how we're actually going to deliver Meridian's volume, and I don't want to promise something in a press release that turns out not to be true in three months.\n\nOne thing everyone should know before deciding anything: the investor deck I wrote last month describes Meridian as 'supplied fully by direct trade, at our standard farmer premium'. That is what the investors are expecting to see. I can give you one more piece of the picture. Choose well.\n\nIda","offers":[{"id":"o1","title":"What the journalist actually asked","text":"1EGVBIgBv/zjllPlUWOjmDhVK29PpGVIg47DeyMz50N/8iuIFbJNyyOdxyR/f8Q9yqyWPfgpL7hIZ23NkcPyELoyQy76YdxTNO0ODa8kAwOYg5yrafWda07ykMqreY1eyOTBM2YYWOceZTFra3U+mC4K7nzZKe30yYzM5+dOQ1JaNijHtyra8znzDRrl2Eo8M9a15TUxm1IuJN+XyvyaZO96pXblxD9YFuT/GNFZX4bYb4KyxtZTT3OxoM5EuMKPot7tuud+dYIA5wPUXtTSeG7PJarWxfRio6/Q80xNnsMAXZz2XIKPF3DkCMbl2KPNpfa8xQ=="},{"id":"o2","title":"How loud to go, and how to say it","text":"01VPKLLOCoEjaOxOrQcHGAkI/V3Z96B9xxY6/7eIXLBnJawUPBvEA3akOCEojvwHgOdOm+w/eJPT63PTM+Za3VmNG2bg8Z5PPJmZoNuKYMy3jeDoFvN0ZaCsMKnaAU6ryYvQHTWKwp5JAjcu/y+GSQRgOksPIxQ/gXPnQTyoCr2LHeEG2Dsak7OVwVHuos6KqrJ8RQ2wah5oPXgE7RPNGVGz9ytqwJbyZC1i5BrIcPOOGykIfk0w/yZTw2vhB/ryIUIxhGkrXsin7zieqSko2S0JVceQ/jrm6YHKrZUTwyiW7D6n38yA+wVGGMHDOlkDPKadHWrGr2GYBa87H2w97KOOKfaLhfu3nfZbgqEKI011O40Ko/gh9t2btEwq1E6HWYeCaBCJKP+ydik="},{"id":"o3","title":"What made the Basala post work","text":"uaSolWJTmFRuFB0MwoD+MtPZUeLAbrO+p70ld6hegM5qjOmgV5gRXSQx1HI5NnPiqxc4B06M1P8PAiBBDo/MlFwOx0sU972VoFTJ6x8SbsMltJfHa2jbzLFP7yYaFXp7mR3+umylv0aC+K5mzikT7VEvJu6GjtY2rC+pRR8ziSj5AlKu2FvjAPO9Z2rUTKmGDMqSBgCMb7ifqgjZ6oEtcUOQVRM5ZHbPM3uPe372yeN5T9h/RxaunrX2uyD3HVmp4mobcaVEmeUrPNfhJOyLM0lDXo+UO4/IRsrCDK/qWNq3x/PYuyydTaoiemj9m56Z/yPfVIYDsSqytp1HlAEF0gq22WCwnV96sznmnOWy"}]},{"id":"sanne","name":"Sanne Lindqvist","title":"Community & Social Lead","subject":"Followers are already asking about Meridian","email":"Hey,\n\nSmall thing, but I want to flag it before it grows. We haven't announced anything official yet, but word has clearly got out, probably through Meridian's own channels, and a few of our most engaged followers are already commenting under unrelated posts asking about it. Mostly excited. But a handful are asking pointed questions like \"will you still be able to say you know every farmer by name at that size?\", which, fair, is exactly the question we've spent years training people to ask.\n\nThis is our most loyal audience. They didn't just buy coffee, they bought the story: the founders standing in the photos, the \"no middlemen\" line on every bag. If anything about how we're sourcing this contract doesn't match that story, this specific group of people will notice fastest and loudest, long before any journalist does.\n\nWhat I can't tell yet is what we would actually be hiding, if anything — that depends on the supply side. I can tell you one more thing before you decide. Choose carefully.\n\nSanne","offers":[{"id":"o1","title":"Who our most loyal followers are","text":"kEOsMArYebo+97Rosd8GrlHql7j+/6M8jYtpCu4ycO0/V0NmU3UZ0RHQNdFP89XnhkvPVp3qQ0yeCMKSGoeCDFdZQ/QDhSjjMRKgpEmYEgof5goAKx5QVUcXHLrgfHPXwHglEHAwwVmKfymz8t3HwZUuo45ZmjLzOHmEej+aFc+dqApDn/0HWeL8CLlgsxxj+VzC3oNTce8oCDjGQGj6ZfmhTFD3ucjspuJvT9hFJ17SsyuzN+mcwnLOAAWTbfPhfRKGQ2GEjFc9S33rIiQ4jrsVAlz2/Jw17UtcLBd73CIg4DZmvQ=="},{"id":"o2","title":"What followers are asking right now","text":"44SrzFBXHPcNyzjgUZKBQ+skJibNpiksn3mqH0uC4GvM9MXW4YQ6OJi9CH0z/Zf93mRc0Xs4MoazYWG6bIoQJNQphVi9oBoS8GvUO8PHw3gj6rb5HANwyzp7vyBuhmndpaTmOSGH0RcRKg2Ws3HtUkBX96aR6u2JLc3xnmEHsDChSnnbr9Qw9SqrHlXPZeRk0e65phHDO+I0k6H9/qKcBeDSJQHVBVT2M0HirMUTcg6BghQzlkD7JmqPCxTJiDPF4FXOYTowiKG/RCcFHOcq9pKBsEo5iPcEn0wogRB1IHVSdQ=="},{"id":"o3","title":"How our community would really react","text":"yKiTyWEnwd0QVv4GZhBs/xYzEN6AaUYKSsn1lhbeCauHbvJfy0JrJBZ7IVWP3664HpaNcANBfqdDFnEP5FIUzodigCkaPNdneWgLJ23uYd5zDOP4aPBPzj7q5nBlqW5rZgAw3CRgEAoDo4DZHDaAHwP7M3FwF8q/8iW241eYrEKzH04lXg48DsCJjj/fFWM0Syj0k2P/BrK81O0c/MNur643FgXzokj2Do64D4IByskIRE5b64+anvsgTE2iHFMBaqDBBXEGS+Fh/+pKc3arLVVnqBx09OWCUPO0qIm8C3YnuqRlEJyZybQAdwRdlCsKtKMf4t0Ecyws0uFJuhPedJtsxLNn7gxVRw=="}]},{"id":"priya","name":"Priya Patel","title":"Head of ESG & Communications, Meridian Partners","subject":"Draft press release — need to check one line with you","email":"Hi,\n\nWe're finalising the press release for our new-office launches, and I wanted to flag something directly rather than assume. Our line about the coffee partnership currently reads: \"sourced entirely from Nordhavn's named partner farms, at above-market prices, with no intermediaries.\" Honestly, that sentence is a big part of why we chose you over two cheaper suppliers. Our own ESG story for this expansion leans on it more than I first expected.\n\nI want to be straightforward about what that means for us: if that line isn't fully accurate, it's not just an awkward correction for you, it becomes our problem too, in our own launch coverage, in front of our own leadership and clients. I'd genuinely rather adjust the wording now, quietly, than have someone challenge it in six months.\n\nSo, plainly: is that sentence still going to be true at the volume and timeline we're asking for? I don't need a perfect answer today, just an honest one. I can tell you one more thing from our side before you decide. Choose carefully.\n\nPriya","offers":[{"id":"o1","title":"What happens to that sentence now","text":"4q11QGOcTx2gAMFmuhm0hxf0glrUW1fvEWSf3icuzXh4gRuK071GL0xEsV8yzf2zlR5Q5RqtjuwA4PpzEydz6UGblRdNqcZK6ujQ2Es85jj8aqeMG8qtwJSa+fFru5Lef98VcyWMzvkkAYROSi7fla/M/w6PAsHTPMDKKEO3duxqV/CavZY+zc+ljhkJjb2XeBCwXfs3GG1IAssDBYjUm4rgg1Z6Aqi1blFVHt1R8lsUgM0Wf5FFUsKQOJGEbbMFGFH3lxXYWjvvwLpyjEVhnLs0kIv3urO0jorCYkKTDTw1YQXHCUdDX0WneAPCL3WBaLHZddnZIzqnPoCEdQ8s4QZslWiAobcQ5AL5c1PP+rMi2kjfdQTTdyB2lxyDMMHutUyTZOPB81wINesvUTKfuQ0="},{"id":"o2","title":"Why one sentence matters so much to us","text":"WQ+00lMaqnghq+upLpRko5YlyTuqXYDAbYtudTYHcUGfOkxKc8nOTKIKwmJK5edfFEh7dET6cGyNpRPFZwLeRCBHLGL5eZ6JOYCeM8685BKnBcRR6zl+V3kjay49jfXLkLI3Oig87YAuVfKU2MsiFlKN1qxWamQqGkUrQl4S2bO/3ae2Yn5gXI8jUppsnfySpdRMRqDOkfUVJa7AtgaMyl5tqVgROjipAS2Rt4jMI2OPniLHFt0fDE2LS/S7Y9PO2+Fmu4GFAscEmHHhzmvBJiQIlt44jpylLHB6VAXYf6I+CszuZmH+7G0hk7XHfQspPJRsY7ac1lPJb6FE"},{"id":"o3","title":"How our launch press release is checked","text":"g5gCVIVNuc724WsVfC/eyY5CmaC1Be8AWtu8vymDBEQsPIBDvT8QCKAsslNNGD4ZrMKOsp9DAI+TUAxCUCqOaBKPmMtdRqNXnyqk/Ykfscj4j43AhoWdINJBcRPH8P+UGNayHGUpUuQBWinF37rutlC2FqJG6+20ssWv28B+hNyMKPIP6whW4HCY+gvqj0fWOpfkJBDMktfP3gSGaThzd3Mg+zr8TdGyql1tJgR8KcUX1yY9Vjl5wLpvbMfL12o6whYl2I9VoxZfKzddyvKDclQ3COa3VDTRadqnut/NHBWhS8ZN1kKnn6WN9G/EGqUZ2TnhUzbr"}]}]}],"decisions":[{"id":"D1","title":"Decision 1 — The Founding Farmers' Price","A":"Keep paying all three founding partner farms their full above-market premium, even though it leaves razor-thin margins on the Meridian volume and could jeopardise the funding round.","B":"Renegotiate the founding farms' price for this contract down towards the standard market rate.","short":{"A":"Keep the premium","B":"Lower the price"}},{"id":"D2","title":"Decision 2 — The Bridge Supplier","A":"Bring in a bulk trader to cover the volume gap immediately, planning to replace it with properly vetted new fair-trade partners within the next several months.","B":"Commit only to the volume that Nordhavn's own partner farms and properly vetted new ones can supply, even if that means offering Meridian less coffee, later, than they asked for.","short":{"A":"Bridge trader","B":"Wait for vetted farms"}},{"id":"D3","title":"Decision 3 — How Loud Do We Go?","A":"Announce the Meridian partnership in Nordhavn's usual voice — bold, values-led, exactly like every other announcement — without changing anything about how the story is told.","B":"Announce the deal in a shorter, more measured style — careful language and no big campaign — while the sourcing picture is more complicated than usual.","short":{"A":"Usual loud voice","B":"Measured announcement"}}],"newsflash":"aO51QRu3jgyUtXcS2/TiHp8Jnm2Nq3Mxt27RjO05AvsCpWh8IrbAg7UW6ijglveGLTLVfkQYcdGB9AarbI7JCAPWHScY55SBEPcp8TZwApRcxcGlxrEyco/W1QYGCw7OSa+vF9ei79DNhHhYlEpjXzKJ29tQBVHUM1xYfYsbTz70Tr+hK6ahbWVPT8b6HKaVzY2skHRSxFyKGB5ycL5rZ4atZiVQRGW0HkOksWg7Y8S9P7vVfOUojH9/z3cIzz+dvaRsFxmK/TWItGAZbRza8S0v3ZMMUirU/9ltG86TtyOZc/4ejV+QxgtaBJ8LilDKdLYjtG00WMwlwCj+Jv/N473Goz2FB7ZR3etQ83U/Rtkp06fiy2Dy+vadwNtbQVkJYBBB+8VXGMfr/0n+5LrUP1aCd/pPaCOxU6A/KFPeVvg2DbOM0b7ErCfrNo+bUG9tWiHCsbilM+/VRXvdrwX3hG6lQAxkP9Lu+rVprtkQqTH9sBMMutc/TCIYy1OmTaR1bJo3hKM/iomNWqcGkOGos4HtrWQUA69S/Rz9HLhnwAzxwnF1Gi2EkTBnhsctYWPnLWULDpsKhzCg <script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
let st = {mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:""};
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function words(t){ return (t.trim().match(/\S+/g) || []).length; }
const CHAR = Object.fromEntries(S.roles.flatMap(r => r.characters.map(c => [c.id, c])));
const TWO = S.two_player ? S.two_player.roles.map(r => ({...r, characters: r.characters.map(id => CHAR[id])})) : null;
const roles = () => (st.mode === "2" && TWO) ? TWO : S.roles;
const role = () => roles().find(r => r.id === st.role);
const pair = () => st.mode === "2";
const num = n => ["zero","one","two","three","four","five","six"][n] || String(n);
const roleName = r => r.dept ? `${r.label} — ${r.dept}` : r.label;
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}
const norm = t => t.replace(/\s+/g, " ").trim();

/* ---------- the top bar: same place on every screen ---------- */
function teacherLink(){
  return S.teacher_url ? `<a class="teacher" href="${esc(S.teacher_url.replace(/\/?$/, "/") + "?sim=" + encodeURIComponent(S.id))}" target="_blank" rel="noopener" title="Opens the teacher tool (password needed)">Teacher</a>` : "";
}
function topBar(who){
  return `<div class="wrap"><span class="title">${esc(S.title)}</span><span class="right">${who ? `<span class="who">${esc(who)}</span>` : ""}${teacherLink()}</span></div>`;
}

/* ---------- start screen ---------- */
function renderStart(){
  const two = st.mode === "2" && TWO;
  $("#app").innerHTML = `
  <header class="bar">${topBar("")}</header>
  <div class="wrap start">
    <h1>${esc(S.title)}</h1>
    <p class="lede">You work at ${esc(S.org)}. Your ${two ? "team of two" : "group"} has to make ${num(S.decisions.length)} decisions — and each of you holds information the other${two ? "" : "s"} ${two ? "doesn't" : "don't"} have.</p>
    <form id="startForm">
      <fieldset><legend>${two ? "Which player are you?" : "Your role"}</legend>
        <p class="muted small">${two ? "Decide between you who is Player 1 and who is Player 2." : "Agree in your group who takes which role. If there are more than three of you, two people can share a role."}</p>
        <div class="choices">${roles().map(r => `
          <label class="choice"><input type="radio" name="role" value="${r.id}" ${st.role===r.id?"checked":""}>
            <span><b>${esc(roleName(r))}</b><br><span class="muted small">Your contacts: ${r.characters.map(c => esc(c.name)).join(", ")}</span></span></label>`).join("")}
        </div></fieldset>
      <button type="button" class="btn" id="go" disabled>Start</button>
    </form>
    ${TWO ? `<p class="switch">${two
        ? `Three or more of you? <button type="button" class="linkish" id="mode">Switch to the group version</button>`
        : `Only two of you? <button type="button" class="linkish" id="mode">Switch to the two-player version</button>`}</p>` : ""}
    <p class="muted small" style="margin-top:2rem">${esc(S.disclaimer)}</p>
  </div>`;
  const m = $("#mode");
  if (m) m.onclick = () => { st.mode = two ? "3" : "2"; st.role = null; save(); renderStart(); };
  const f = $("#startForm");
  const upd = () => { $("#go").disabled = !f.querySelector("input[name=role]:checked"); };
  f.addEventListener("change", upd); upd();
  f.addEventListener("submit", e => e.preventDefault());
  $("#go").addEventListener("click", () => {
    const r = f.querySelector("input[name=role]:checked");
    if (!r) return;
    st.role = r.value; st.tab = "context"; save(); render(); window.scrollTo(0,0);
  });
}

/* ---------- main shell ---------- */
const TABS = [["context","Context"],["firstlook","First look"],["listening","Listening"],["inbox","Inbox"],["decisions","Decisions"],["submit","Write & submit"]];
function render(){
  if (!st.role) return renderStart();
  const r = role();
  const pending = r.characters.filter(c => !st.choices[c.id]).length;
  $("#app").innerHTML = `
  <header class="bar">${topBar(r.dept ? r.label + " · " + r.dept : r.label)}
    <div class="wrap"><nav class="tabs" role="tablist">${TABS.map(([k,l]) => `<button type="button" class="tab" role="tab" data-tab="${k}" aria-selected="${st.tab===k}">${l}${k==="inbox"&&pending?`<span class="dot" title="${pending} choice(s) still open"></span>`:""}</button>`).join("")}</nav></div></header>
  <main class="wrap" id="main"></main>
  <footer class="wrap">${esc(S.disclaimer)}<br>Nothing you type here leaves this browser tab unless you copy it yourself.
    <button type="button" class="linkish" id="reset">Start again (choose a new role)</button>
    <span id="resetAsk" hidden> This clears everything you've done, including your text. <button type="button" class="linkish" id="resetYes">Yes, clear it</button> · <button type="button" class="linkish" id="resetNo">Keep my work</button></span></footer>`;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { st.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0); });
  $("#reset").onclick = () => { $("#resetAsk").hidden = false; $("#reset").hidden = true; };
  $("#resetNo").onclick = () => { $("#resetAsk").hidden = true; $("#reset").hidden = false; };
  $("#resetYes").onclick = () => {
    try { sessionStorage.removeItem(STORE); } catch(e) {}
    st = {mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:""};
    pendingPick = {}; render(); window.scrollTo(0,0);
  };
  ({context:tabContext, firstlook:tabFirstLook, listening:tabListening, inbox:tabInbox, decisions:tabDecisions, submit:tabSubmit})[st.tab]();
}

/* ---------- tabs ---------- */
function tabContext(){
  const c = S.context;
  $("#main").innerHTML = `
    ${S.image ? `<figure class="hero"><img src="${S.image.src}" alt="${esc(S.image.alt)}"></figure>` : ""}
    <div class="prose">${c.text.split("\n\n").map(p => `<p>${esc(p)}</p>`).join("")}</div>
    <div class="note scar"><b>${esc(c.scar.label)}</b><p class="prose">${esc(c.scar.text)}</p></div>
    <div class="note proof"><b>${esc(c.proof.label)}</b><p class="prose">${esc(c.proof.text)}</p></div>
    <div class="note clock"><b>The clock</b><p class="prose">${esc(c.constraint)}</p></div>
    <h2>Who knows what</h2>
    <p class="muted">You only see your own contacts. What the others know reaches you by talking to ${st.mode === "2" ? "your partner" : "your group"}.</p>
    <div class="contacts">${roles().map(r => `<div><b>${esc(roleName(r))}</b>${r.id===st.role?" (you)":""}<br><span class="muted">${r.characters.map(ch => `${esc(ch.name)}, ${esc(ch.title)}`).join(" · ")}</span></div>`).join("")}</div>`;
}

function tabFirstLook(){
  $("#main").innerHTML = `
    <p>Before you read anything else, go with your gut. Nobody sees these answers — they're for ${pair() ? "talking with your partner" : "your group discussion"}.</p>
    ${S.decisions.map(d => `
      <div class="dec"><h3>${esc(d.title)}</h3>
        ${["A","B","Unsure"].map(o => `<label class="opt"><input type="radio" name="fl_${d.id}" value="${o}" ${st.firstLook[d.id]===o?"checked":""}>
          <span>${o==="Unsure" ? "<i>Not sure yet</i>" : `<b>${o}.</b> ${esc(d[o])}`}</span></label>`).join("")}
      </div>`).join("")}
    <p><b>Discuss:</b> Where do you disagree? Which decision feels hardest right now, and why?</p>`;
  $("#main").onchange = e => { const [, id] = e.target.name.split("_"); st.firstLook[id] = e.target.value; save(); };
}

function listeningAnswers(){
  try { return S.lc ? JSON.parse(unscramble(S.lc, `${S.salt}|listening`)) : null; } catch(e) { return null; }
}
function tabListening(){
  const L = S.listening, key = listeningAnswers(), done = !!(st.mcqDone && key);
  const n = L.questions.length, right = done ? L.questions.filter((q,i) => st.mcq[i] === key[i]).length : 0;
  $("#main").innerHTML = `
    <p>Your teacher will play <b>${esc(L.name)}</b>. Answer while you listen${key ? ", then press <b>Check my answers</b>" : " — your teacher will go through the answers afterwards"}.</p>
    ${L.questions.map((q,i) => `<div class="mcq"><b>${i+1}. ${esc(q.q)}</b>
      ${Object.entries(q.options).map(([k,v]) => {
        const cls = !done ? "" : (k === key[i] ? "right" : (st.mcq[i] === k ? "wrong" : ""));
        return `<label class="${cls}"><input type="radio" name="mcq_${i}" value="${k}" ${st.mcq[i]===k?"checked":""} ${done?"disabled":""}><span>${k}: ${esc(v)}</span></label>`;
      }).join("")}
      ${done ? (st.mcq[i] === key[i] ? `<p class="res ok">✓ Correct</p>` : `<p class="res no">✗ ${st.mcq[i] ? "Not quite" : "No answer"} — the answer is ${key[i]}</p>`) : ""}</div>`).join("")}
    ${!key ? "" : done
      ? `<div class="score">You got ${right} of ${n} right.</div>`
      : `<p style="margin-top:18px"><button type="button" class="btn" id="checkL">Check my answers</button>
           <span class="muted small">You can't change your answers afterwards.</span></p><p id="checkMsg" class="small" aria-live="polite"></p>`}`;
  if (done) return;
  $("#main").onchange = e => { if (e.target.name && e.target.name.startsWith("mcq_")) { st.mcq[e.target.name.split("_")[1]] = e.target.value; save(); } };
  const b = $("#checkL");
  if (b) b.onclick = () => {
    const missing = L.questions.map((q,i) => st.mcq[i] ? null : i+1).filter(Boolean);
    if (missing.length && !b.dataset.sure) {
      $("#checkMsg").textContent = `You haven't answered question${missing.length>1?"s":""} ${missing.join(", ")}. Press the button again to check anyway.`;
      b.dataset.sure = "1"; return;
    }
    st.mcqDone = true; save(); tabListening();
  };
}

let pendingPick = {};   // cid -> offer id, chosen but not yet confirmed
function tabInbox(){
  const r = role();
  $("#main").innerHTML = `
    <p>Each contact will tell you <b>one more thing</b> — you choose what. All three are useful, but some matter much more than others — and what matters most often depends on what ${pair() ? "your partner's" : "your teammates'"} contacts know. <b>Talk to ${pair() ? "your partner" : "your group"} before you choose.</b> Your choice is final.</p>
    ${r.characters.map(c => mailHTML(c)).join("")}`;
  r.characters.forEach(c => wireMail(c));
}
function mailHTML(c){
  const chosen = st.choices[c.id];
  const open = !chosen;
  let offers;
  if (chosen) {
    const o = c.offers.find(x => x.id === chosen);
    offers = `<div class="offers done">
        <div class="opened"><p class="t">${esc(o.title)}</p><div class="prose">${esc(unscramble(o.text, `${S.salt}|${c.id}|${o.id}`))}</div></div>
        ${c.offers.filter(x => x.id !== chosen).map(x => `<div class="offer closed" aria-disabled="true">${esc(x.title)}</div>`).join("")}
      </div>`;
  } else {
    const pick = pendingPick[c.id];
    offers = `<div class="offers"><p class="ask">${esc(c.name.split(" ")[0])} can tell you one more thing. Which do you want to know?</p>
      ${c.offers.map(o => `<button type="button" class="offer" data-c="${c.id}" data-o="${o.id}" aria-pressed="${pick===o.id}">${esc(o.title)}</button>`).join("")}
      ${pick ? `<div class="confirm"><button type="button" class="btn" data-confirm="${c.id}">Ask about this</button><span class="muted small">You can't change this afterwards.</span></div>` : ""}
    </div>`;
  }
  return `<details class="mail" id="m_${c.id}" ${open || st.tab==="inbox" ? "open" : ""}>
    <summary><span><span class="from">${esc(c.name)}</span>, <span class="muted">${esc(c.title)}</span><br><span class="subj">${esc(c.subject)}</span></span>
      <span class="state ${chosen?"":"todo"}">${chosen ? "Answered" : "Choose one"}</span></summary>
    <div class="body"><div class="prose">${esc(c.email)}</div>${offers}</div></details>`;
}
function wireMail(c){
  const box = $("#m_" + c.id);
  box.querySelectorAll(".offer[data-o]").forEach(b => b.onclick = () => { pendingPick[c.id] = b.dataset.o; rerenderMail(c); });
  const cf = box.querySelector("[data-confirm]");
  if (cf) cf.onclick = () => { st.choices[c.id] = pendingPick[c.id]; delete pendingPick[c.id]; save(); rerenderMail(c); updateDot(); };
}
function rerenderMail(c){
  const old = $("#m_" + c.id); const tmp = document.createElement("div"); tmp.innerHTML = mailHTML(c);
  old.replaceWith(tmp.firstElementChild); wireMail(c);
  const btn = $("#m_" + c.id + " [data-confirm]"); if (btn) btn.focus();
}
function updateDot(){ const pending = role().characters.filter(c => !st.choices[c.id]).length; const t = document.querySelector('.tab[data-tab="inbox"] .dot'); if (t && !pending) t.remove(); }

function tabDecisions(){
  const all = S.decisions.every(d => st.decisions[d.id]);
  $("#main").innerHTML = `
    <p>Agree the ${num(S.decisions.length)} decisions <b>${pair() ? "together" : "as a group"}</b>, then ${pair() ? "both of you enter" : "everyone enters"} the same answers here. For each one, note the biggest risk or objection — you'll need it in your writing.</p>
    ${S.decisions.map(d => `
      <div class="dec"><h3>${esc(d.title)}</h3>
        ${["A","B"].map(o => `<label class="opt"><input type="radio" name="dec_${d.id}" value="${o}" ${st.decisions[d.id]===o?"checked":""}><span><b>${o}.</b> ${esc(d[o])}</span></label>`).join("")}
        <label class="small muted" for="hw_${d.id}">However… (the main risk or objection)</label>
        <textarea id="hw_${d.id}" data-hw="${d.id}">${esc(st.however[d.id]||"")}</textarea>
      </div>`).join("")}
    ${all ? `<div class="flash"><b>Breaking news</b><div class="prose">${esc(unscramble(S.newsflash, `${S.salt}|newsflash`)).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</div></div>`
          : `<p class="muted small">When you've chosen all ${num(S.decisions.length)}, some breaking news will appear here.</p>`}`;
  $("#main").onchange = e => { if (e.target.name && e.target.name.startsWith("dec_")) { st.decisions[e.target.name.slice(4)] = e.target.value; save(); render(); } };
  $("#main").oninput = e => { if (e.target.dataset.hw) { st.however[e.target.dataset.hw] = e.target.value; save(); } };
}

function tabSubmit(){
  const W = S.writing;
  $("#main").innerHTML = `
    <h2 style="margin-top:0">Your ${esc(W.label)} to ${esc(W.addressee)}</h2>
    <p>About ${W.words} words. Your ${esc(W.label)} should:</p>
    <ul>${W.instructions.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    <textarea class="memo" id="memo" placeholder="Write here. Your text is kept in this tab until you close it.">${esc(st.memo)}</textarea>
    <div class="count" id="count"></div>

    <div class="consent">
      <b>Can your teacher check your text with AI?</b>
      <p class="small">Your teacher may use the SimLearn teacher tool, which can ask an AI system (Claude, by Anthropic) to suggest feedback on your writing. Only your text and your group's choices would be sent — not your name. Your teacher always makes the final decision about your grade. If you say no, your teacher marks your text by hand. Saying no has no effect on your grade.</p>
      <label><input type="checkbox" id="consent" ${st.consent?"checked":""}> Yes, my teacher may check my text with AI.</label>
    </div>

    <div id="issues" class="issues"></div>
    <button type="button" class="btn" id="make">Create my submission</button>
    <div id="out"></div>`;
  const memo = $("#memo"), count = () => { const n = words(memo.value); $("#count").textContent = `${n} word${n===1?"":"s"}`; };
  memo.oninput = () => { st.memo = memo.value; save(); count(); }; count();
  $("#consent").onchange = e => { st.consent = e.target.checked; save(); $("#out").innerHTML = ""; };
  $("#make").onclick = makeSubmission;
}

function makeSubmission(){
  const r = role(), W = S.writing;
  const missing = [];
  const openChars = r.characters.filter(c => !st.choices[c.id]);
  if (openChars.length) missing.push(`You haven't chosen what to ask ${openChars.map(c => c.name).join(", ")} yet (Inbox).`);
  const openDec = S.decisions.filter(d => !st.decisions[d.id]);
  if (openDec.length) missing.push(`Your group's answer is missing for ${openDec.map(d => d.title.split(" — ")[0]).join(", ")} (Decisions).`);
  if (words(st.memo) < 50) missing.push("Your text is very short — write your " + W.label + " first.");
  $("#issues").innerHTML = missing.map(m => `<p>${esc(m)}</p>`).join("");
  if (openDec.length || words(st.memo) < 50) { $("#out").innerHTML = ""; return; }

  const ai = st.consent ? "yes" : "no";
  const choices = r.characters.map(c => `${c.id}=${st.choices[c.id] || "-"}`).join(", ");
  const decisions = S.decisions.map(d => `${d.id}=${st.decisions[d.id]}`).join(", ");
  const memoText = st.memo.trim();
  const code = checkCode([S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""]);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Copy everything in the box and paste it into the <b>Moodle assignment</b> your teacher has set up. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you paste it.</p>`;
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}

render();
</script>
</body>
</html>
