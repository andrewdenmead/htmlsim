<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Podgorica Gateway: The First Impression — SimLearn</title>
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFEA; --line:#D3D8D1;
  --pine:#2F5D50; --pine-2:#24493F; --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .right{display:flex;align-items:center;gap:10px;flex:none}
.teacher{font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}
</style>
</head>

<script id="scenario" type="application/json">{"id":"podgorica","version":1,"title":"Podgorica Gateway: The First Impression","org":"Podgorica Gateway International Airport","level":"B2/C1","disclaimer":"This is a fictional teaching scenario. Podgorica Gateway, Studio Bruhn, Branik and Lindenhof airports, and every character are invented for classroom use.","context":{"text":"Podgorica Gateway International Airport is due to open within the year, replacing Montenegro's ageing existing airport and serving as the country's new front door. The government has tied the opening closely to Montenegro's EU accession bid: a delegation from Brussels is scheduled to tour the finished terminal in person, and officials want the building to send a clear message that the country is modern, organised, and ready to join. The terminal's architecture and wayfinding system were commissioned from Studio Bruhn, a well-regarded German design practice known for bold, minimalist work that photographs beautifully and has won awards elsewhere in Europe. Their first concept for the signage — icon-led, almost no text, dramatic use of colour and light — has impressed everyone who has seen it in presentation. Whether it will impress in practice is a separate question. Real passengers moving through a real terminal for the first time are not the same as a room of stakeholders looking at renderings, and nobody yet has firm evidence either way about whether people can actually find their gate. Studio Bruhn, the airport's research and testing team, and the team responsible for actually producing and installing the signage all have pieces of the picture. None of them currently has the whole thing. A final decision on format, look, branding, and launch approach is due soon, and the delegation's visit date is not moving.","scar":{"label":"The Branik Confusion","text":"Two years ago, a similarly ambitious icon-only wayfinding system opened at Branik International Airport to strong design-press coverage. Within its first month, passengers were regularly missing connections and airport staff had to station extra people at junctions just to point people the right way. Branik quietly retrofitted text signage across the terminal within six months, at real cost, after regional aviation media picked up the story."},"proof":{"label":"The Lindenhof Standard","text":"Lindenhof International, a mid-sized German regional airport, uses a plain icon-and-text wayfinding system that nobody has ever called exciting. It also consistently tops passenger satisfaction surveys for ease of navigation, and its staff report almost no wayfinding-related complaints. It has never won a design award and never needed one."},"constraint":"The EU accession delegation's visit date is already confirmed with Brussels and cannot be moved, and the ministry wants the terminal to make the right impression on that day."},"listening":{"name":"Terminal Talk","questions":[{"q":"When did standardised airport pictograms originate?","options":{"A":"1990s","B":"1970s","C":"2000s"}},{"q":"Who worked with ICAO to create the shared symbol set?","options":{"A":"Swiss design team","B":"UN committee","C":"Individual airports"}},{"q":"What made the pictogram system work, per the podcast?","options":{"A":"National branding","B":"One designer's vision","C":"Testing, simplification"}},{"q":"Roughly what share of first-time travellers pause at an unclear sign?","options":{"A":"About 10%","B":"About 20%","C":"25% to 33%"}},{"q":"What does that pause cause at peak hours, per the podcast?","options":{"A":"Congestion, missed connections","B":"Higher ticket prices","C":"Longer security queues"}},{"q":"Where have some newer terminals leaned into brand-forward signage?","options":{"A":"South America","B":"Asia, the Gulf","C":"Scandinavia"}},{"q":"What did some of those airports quietly do within their first year?","options":{"A":"Added standard signage","B":"Removed all signage","C":"Rebranded entirely"}},{"q":"What's one genuine advantage of digital signage, per the podcast?","options":{"A":"Cheaper to install","B":"Never needs maintenance","C":"Real-time updates"}},{"q":"What risk of digital signage does the podcast highlight?","options":{"A":"Too colourful","B":"One failure point","C":"Confuses only children"}},{"q":"What do several major airports now require by policy?","options":{"A":"Non-digital fallback signage","B":"Minimum icon size","C":"Annual passenger surveys"}}]},"roles":[{"id":"A","label":"Role A","dept":"Studio Bruhn — Concept & Visual Identity","characters":[{"id":"jonas","name":"Jonas Reinke","title":"Junior Wayfinding Designer, Studio Bruhn","subject":"Something from the early tests I haven't flagged yet","email":"Hi — before this goes any further I wanted to tell someone. A few weeks ago I ran an informal test with six people who aren't designers, just friends and family, nobody from the airport. Three of our icons caused real problems: people mixed up the baggage claim symbol with lost property, two people walked straight past the transfer icon without recognising it as an arrow, and nobody could tell our exit icon from the emergency exit sign at a glance. It was only six people, so I haven't said anything to Thomas yet — I don't want to cause a panic over an unofficial test. But it's been bothering me. I heard the accessibility team is doing formal testing this week, and I'd be interested to know if they're seeing anything similar, because if they are, six people wasn't a fluke.\n\nTwo more things nobody has said out loud. There's no test with real passengers anywhere in our schedule — the plan is to finish, photograph and open. And the fixture shapes aren't final either; Thomas changed them again last week. I can give you one more thing before you decide — choose carefully.","offers":[{"id":"o1","title":"What Thomas sees in an icon-only system","text":"zZdQ+j5GRsJocRs7ftBFv7ZxuvHB4F9elNIdF57rLQNLSCHoJ3Cb/oeeJWHBxkGI9AuWT8ktH744pnbfSaYlrIu7FHA268fu9BXF4vibQAv+5eA0IaUm96M80T50myr7yjoUSHe6RiqbsqJflpsBSaFHRRP7QqJoqaUy7Gad8WLsfn6dturaS4Kg6aTHuAgvhPb1tKcOaw7nZsnaeH5JBJ9RHnmmhX6qOfhCv73ogWAyS0JP0C8eXrXi1jNc1yMHQnA4GVDW0psGWNe6r6/FQSDoZR4G3kReu4b2MTo8XQtdvcpnzgNjPRlv7Bd44L2qJSryQEmPApsS71tWj9Vyx2aMtsazv3IJ0OX5Y6PvHp7qeN6KOVbeltzrVzyDDeqWENFXqbUqxXfGilxPwNHgBzWyUastVQ=="},{"id":"o2","title":"Which icon worries me most now","text":"bRmcsn2M+9CwYwWmUkoEhf2pEZ2tsmF98++qykp8VfAVY2Pjb9kGpIZEGkoO/8wV4ImKgmrsITT8VcIy3MhxsqW59fut653SU+FJIr+lTjuMy5v65JJkLpHIDAMVovliylT3dbeaMIKJjqrtlmuGCz3/AWxsKoEHiElbhjSvv2k5gZSoVdShCiujpQGU8I1vJ7pMfmxpFhEcr8ftYi9xAEt8ak6Pf7Insuq5o4EVleoXTPA7CSqrJtowsc5fAUeZ/3/cv8ikJ0LMFhYpB/7BfCnJlECNJ4bNKctCJ8x4Rx3+qhc+T07PE/boNtTEpDBQlT5F/Gun2JUJ+G+6IDRAJ+6fi9JLx0ti580Sn5DZmP6+zqtL2/m4uJrplhZWNmovF6fQK9TGdsvRSdDo/nnRL8srdZ4="},{"id":"o3","title":"What exactly my six testers did wrong","text":"9zgYFp3LmDR1ab2yBs3UpO2BzXBjujkK38hWEEo2ZxmLjVR+vaqc6c7hGTgSlcYk9YA86OUu+qVt5L9uqCcFUbF83OQxE6SUAh4sAAx41/G8uG8gCpHUujQm2q8RDgLCKMh+j9A5ZA98CILa1FHI4HouczAj0bpJINQclk6PjAfa89hW8km7Gd5Nz77VQb0mJ0DSZGqhlc8H2+MrLjpeqanvDpnLAhhaXNaxxfk1BMBJAdDLyNZRYvv6pFWbov8+3P8Xw8M53+p+ReQHYuMp/dv6ZNlK8n8qjzKrYyVySkgd+nZJbYSXHhvVSVCG0bhxoRYxVxqIcn5WRyGbTAeuBg/PJJn0FcfJ8Y3Bw4ztlOYZU8YUK6pDM6U="}]},{"id":"elira","name":"Elira Krasniqi","title":"EU-Accession Communications Officer, Ministry of Transport","subject":"What this visit actually needs to achieve","email":"Hello — I wanted to give you the full picture from our side before decisions get locked in. The delegation's visit will be filmed and photographed for our EU accession campaign, and honestly, this terminal is one of the most visible things Montenegro will show Brussels this year. The plan has been to lean into the bold, modern look — it's the image we want people to associate with the country right now. I know there have been conversations about cost. I'll be direct: I've heard the custom digital fixtures are running over budget, though I don't have the real numbers myself — that's a question for the production side, not me. If the overrun turns out to be serious, I need to know before the delegation date, not after, because it changes what I can promise upstairs about what will actually be finished and working.\n\nWhat I can't judge is what we could give up if the money runs short — I keep hearing different numbers. I can tell you one more thing before you decide. Choose wisely.","offers":[{"id":"o1","title":"What Brussels is actually watching for","text":"zSZ5YoD/rKoPL70GztIbI1Nq7o44dcsKOYd82w2QUVkh1CDM4Tl+4CbP9y6149Yv3QNOvAV4pkBeC57AJfQ1L80+oQS8JfBE9n7/z7YmExYNhSn1p4HlxUWn6BZW9CQMB+2HQcLktUX6ryQAlzLM3lCVCGcTtsnlf79iUN1vSSk1Im9wzfMnUMwZKd8wNJfYcHUtqWryQQutOBHB4If+f1eBfENNlC943jEtM52sK2HWoHO9nSS5Puj8wMGoJwC14sxTlZWSN1WdWIO2EHZvyBTZu7el9gWqCbxGtUCykLjd9rslsBw4qwRynWhvpu59LTUNGRVPSyzD6Z5UWENe2E7g08Wwc9Oi/UItmLZ4xR60yTX1F7uAWRcvxMEvWtZ+pDVhfVjLSsTlbtsHPMJ/FdeINTE8"},{"id":"o2","title":"What the film crews will do on the day","text":"e+KPXQJxmoebnV76ztTS2GXTtRKpn4NOwMK/w1DK+zxoocNmHum4b0hAgPo+YpX/MvFF7n38d9oVxQuD+wJsAFz7DLHwThh/EgHjUfx87b49C32FzraQpOAYAfJ1JzT26YTQsNVUuhQcZ66UMbEMFzHB7ugyVqzPDKpSo+X0rurpvh26d+ARoIM7S0+44v7PrD3nspusXhn0mPf7AJNY+cVg0BEq1UYdd1ffCEoGVGelw4UwrfSBU3UsXpaTQ9Q0iTt+v1q4nKYebdLtlbVaPYOLxDq/qEFPoLDX9taJ4ChcZdjLEiwus2/GBSHg2eF74Xy7Qsti5pccIGQbgRc44Res/4o8Mo+iKwqltFUUctFO9tbLxzQ6apKuq/p5D6efcsnH4+4UxZkLUpm8JXCo"},{"id":"o3","title":"The only photos the campaign needs","text":"Wl3lDrVqghOytctYk//HPDxteLKqneiHE+fRvzOIwyUA+8BIetJ4JT4XfJurhCWAYi3uqbip0fWWy4mJ2OIHrozkiegys44K1BG6Z6mXxgjgOEEocjF/Ul0AxLrmOtRiz46xCACMXaPKE/swcrLAa6dO4CHl2/8lmxf+eImgxPWyPFHYdnViZBpjo+/nCu8Y+1Ymogsk4oyO6y8DzRtvO5Jv3M1EiDGWnYoeWjmwEAErh6nscDN9oxnw1Uuh8OE1nMX7yd2LrOPdmpexZ8KN1deTfG+sEl3ECHvNShlpn67vL+qwAmalPe7xLa5uzskCTJ7C+4miQULbPOnYdZUWJrw20xn1GsJ73MDwzD+BqeOIwWnq6vGDyS0="}]},{"id":"petar","name":"Petar Vuković","title":"Chief Airport Architect","subject":"A sightline problem the icon system doesn't account for","email":"A quick heads-up from the building side. The terminal's main atrium has a dramatic double-height ceiling — it's one of the best features of the design — but it also means that from several approach angles, especially coming off the escalators near the transfer area, overhead signage drops out of sightline for a few seconds before it's visible again. It's a real structural fact about how the space works, not a criticism of the signage itself — any system would face it there, but a system relying on icons alone, meant to be read at a glance, is more exposed to it than one people can also read from further away as text. I don't know yet whether this shows up as a problem in practice or whether people just adjust naturally as they walk. I'd genuinely like to know if the Research team saw anything like this during their passenger walk-through testing, because it would tell us whether this is a real issue or a theoretical one.\n\nI can give you one more piece of the picture before you decide — choose carefully.","offers":[{"id":"o1","title":"Which zones worry me, and which don't","text":"1JCkLkcJHMjdpUxfyT65shqZwZ+qLTwWvz7eixbTAkJrMLQmntMDXAuWMFXLlmDC3NelEVaE8CUb+tDAEFKB98j71S1Lfmi7vnXOdcIFDjqwhL+haFPaKMyXH+hrKs1CPIJmj1ZBXTzNDMHRscpvanZE6WN4/nEw4Xqnj4QoMI0nbdzX27nlViOAsQgDoBun4fXJr3+aN2Pwpl9zNh/thp8LjFSfMABYwKCTtrSI3Zafe75reLUPAYUds/70ct0JN7ff5FUJW7fccSJYshihhaj8oA0QLPBenag4Sw9IqDD4+ax8JSuYroOusscULOoyG3uh7RUSR2JbjtEvHVMqDE+LMUc49szJfLGhoZZRQb/v1ahA42j1LePR8j998BDSVQGrirGluSO9VxinxqDEOXwq"},{"id":"o2","title":"Exactly where the overhead signs drop out of view","text":"1fyEDP0DZJKZbw6HTOBwbnaSUS9E4APQwtBXNXU38EbIiA5xNHRglHm7u4YyWKShmqtZonmcapiS8KZFIsFye87SDqRbj3wpRFpqWLTYUcrRB8sQHgzMnE2TCu8oFIUWneTjuN9ujoMgrCndSLz4my5ecBzO5/bdgWrC473k06m0Uw6JFrZOSpLecQb5tUTKiRLmzfASHpzWBUQz6FrTEl/Ti5GbqcUW/8TctlwXfeaFQMgD5riux5II4UWIANTeTVk3LfHHw1zuOz8suWtLw2Zur4HOoj6BXvQdubZyPgQ5icuQFMN6B8H2UsPGqxvv9B3u0RzW0y32MrCcvUIIDMqJqbNJKTM+5NOoS+FGtrDDZg=="},{"id":"o3","title":"What the atrium ceiling was designed to do","text":"W6bHzl5ljdIMn6V5etyiyOTHN/ixzJgZ+8YGSH1hD2oe4qaj/moLnBPoy50Wie2lkkf2YO5KBIKdzjVS1AwwouXN3yCYQ4dBdl1CQx0sTDRQYhl9pkKl7+vApDsdn8BikLojJs96aF6h3XF+sxC7Ef9iOnnKRmgXoFl1Kkp+DToB6qo4Q5+fEkNWSMRYFwiuC7Ydbl/lcp1/WEhUo2QFEmKXqcN3ywc/q6T09gDW5swT5+Co0qp1O9Ftmjy/WYhPX6q+6yGgq+WogtF3+mxnn8oZq2WzBFszbvZldT0nYI2HzDG80o/uxHP0DlX3+9vq6AJYP2XzxPo8VeMauhxYzRp9SkDJ20+1fTUa3nkyYJvntd+LoD9wN3/oivTy49gwPMwqAoU9xEjIG3ZWKecG5ZBA9cLBmoX3Zdk="}]}]},{"id":"B","label":"Role B","dept":"Research & Testing","characters":[{"id":"sanja","name":"Dr. Sanja Popović","title":"Accessibility Auditor","subject":"Formal accessibility results — not good news on three icons","email":"I've completed the first formal accessibility test on the current icon-only concept, run with a proper sample including older adults and people with low vision, as the EU accessibility rules require. The results aren't good on three specific icons: baggage claim, the transfer arrow, and the exit icon, which people confused with the emergency exit sign — pass rates well below what we'd need to sign off on. I want to be fair here: everything else in the system actually performed reasonably well. This isn't a case for scrapping the whole concept, but those three icons, at minimum, need rethinking, probably with added text. What I can't tell you yet is whether there's realistically enough time left in the schedule to fix this and retest before the compliance deadline — that's not something I control, and I don't want to guess and be wrong about it either way.\n\nOne more note for the record: my brief covered general wayfinding only. Emergency signage was outside the scope, so nobody has tested it yet. I can give you one more piece of the picture. Choose well.","offers":[{"id":"o1","title":"Which people took part in the formal test","text":"BLO1y8yNjXkaO4lt3YAVSsjP/jTFulqY04TclTrmQEjBWn4aEGvGwDNyDQOHk14ccuJmnJkFt63OMjqsWT7eAIVEqB2/3nfJOjApcSnQQ5vUNnPYKG159wT90czra6o9oEoovt6Y6LbTdCXRUyd1qWrCwRUcwHYufhIxv9owGGxdVHYcwgImR2QRbZarGZal6AqcZB3qt2t3nW4CpQ+ ue is the signage design itself or whether a sign is just missing or badly placed there — I'm not a designer and can't tell the difference. I'd like to know from Production whether that junction actually has all its signage installed and positioned as planned, because if something's just missing, that's a much easier fix than a design problem.\n\nI can tell you one more thing before you decide — pick carefully.","offers":[{"id":"o1","title":"Where the walk-through went smoothly","text":"iVGNrmRuRoNhzlk3Wt05cxnffvkT0ZqHsTpd2uSfGNnBRkPNFmoYgjallX/Gri2y9oyWwYkQ0seggk2gHRVSygjU3wiu5q2l6I0l9cSksNoH+XWAqCY5tWSv/Uv2HtpQ4uXfyZQZ0f/gSnYa1tMz6EEcRt7tZhesJ1fLvxELyjfuqd9AIDasfEPttSpW8POo4ttzRImMBYRpfzNez/qm73k4aNIv6JE46VFFHB4tvKymaYcLJb0XqVPdK7PazENg7z1UbisTIrH+O4wU49mddREsC0POsBZ7WOfYpWWW1ABjZr2mYGQJCW1Az7FQB+reYIlvHu6FHMXqwJoXIl3IpeUrCi2R1PVXwsXxE771w2fmIP7SL4Fae+qv1a3v0aUZgdAI4mVOk2aSCtYxsPII04Zo5DbgmusbqMLxtOfVbco9TsqCqKjEh5f5Rgs="},{"id":"o2","title":"What ground staff will do on opening day","text":"CIm1e/OQz/etff2umwT7UaMsgfjF3cSTPR9U8/iJBRIF9qZ9sbA1WNakIURtA9GEPmqOngeiAdxqzE0KpwJ0yDeivSo18HTn7P5XqwCMH3yVSzwn1nCYvs6jeyYaTr4/Rf+/kqarRElMCD4TWLyxL9S61eAX/8Y+C1P5uSyDsvzKIx2VBY/KQSe1QxYtx4m1CaNxuUBEO7JhhdLQ2n2pEd9c1RNMPDi109TxHW2a+2PaqpE58mvzr7nlDWKDLXvCBhSu1MkjXO3N7lCdDseKftw6qh9q1Gwt+AMljHfthCJcRJbW66meWGdpuKykHwP6OPbxfbrhVnAbVH7yAAhSJg2E8Q9ttlR9HKVSkuWm9XvGiAmOaYU="},{"id":"o3","title":"What each person did at that junction","text":"k1/riv7gtE7eGSOx3DywLhfskobhao3HMjHEu3EijHeBY1jlo24C4bmLnwgehpoHZgUZRX05K5rB4v9siB5CyaI9Bj8+lRgbF6GVqNA36VD589TeuVQ4kfU8aomWC+xEl+FL4tbo3wOll65ROHGsOlDIsqYyZCKpKvCsMJTZ9FPifXjnFg4fii3fK5TleVpyq4JoPr4EfivvUiPdABbsmUbjbFiBoXxOThXovLsU63wORM2OWmvhPXTenwAsGLD7/9rdgkjg86Eh14sViI8cl2SBzsf0FiMCY5GgUAV+VMlCsiJUq8VlDPUNQIqaBfbNkbxmRnZrw1CHHFtUGg+UQNgD61OssfKxU5b9J8UI1WMBVlTX2GwQZOvucpRP3oobCn3rBK9vBAZDsspLTGgevU4NtFW6P3iWOMc2krerLOE6/GmxsPfm5VS4DRNS13pDyD4="}]},{"id":"milena","name":"Milena Radulović","title":"Budget & Procurement Officer, Ministry of Transport","subject":"The real cost picture, since someone should say it plainly","email":"I don't think anyone has laid out the maintenance costs plainly, so here it is. The digital signage system, once you include the service contracts and expected screen replacements over the first few years, costs more than twice what was budgeted to run when this was approved — the installation cost was never the issue, it's what comes after. The ministry's budget for this project is genuinely tight; we are not able to simply absorb a large ongoing cost without cutting something else. I'm not saying digital signage has to be dropped. I am saying that if it stays, something else in the plan needs to shrink, and I'd rather that conversation happen now than after the delegation visit. What I don't know is whether switching some or all of it to printed signage is even realistically possible in the time we have left — that's a production question, not mine.\n\nI can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"The real ceiling for the signage budget","text":"10j9qSw7X9Sgo5BpNEWfeXzXskuA0ccALwvx2cwQGv1W7qTXGj1jVemRiyO8QJN3zY1YEk37CJ3Cjl6hRPVejhTW31cEiuqyn4Rx0o9LDNd/SwXo2U8kQp3r5Z9mwFi8v4uBHLbqFpHmbGOQjAkd9CtE+ULDBllDi9ofxkjCitp4zjAkE4tWe0AMORboKRa83wOuJyrHaNdu2A6jta12Tm03BE52x2B4oRYed0DrKFbzQbvHbDKvE4jHQeJUrDYpIwQiqU3/9WXLe0QTjwYO7ovtBLf/Xqm0mr8SQ0iwzADV2c6wucKYURilE0DRIKytsTWmhabYF8g1UwP42UCiK/anErvihLMiT/3cGbhz/clpbUt7xlq28WDDfG7nvWuneZLLBSqGqrdpvOSARak11QcoghjcKh+0A6QtQ0FZtxppNg58YlNJpmKk+hBYeAsxJrtZUoMwnpZv2oIMBvnRZolmOotM00pfHvYYl2j5tC0="},{"id":"o2","title":"What the digital service contract really covers","text":"a72Ee4lNSySM+4WLEWa8CAQYEkUSAHv/Krm2OkVpIi/2W3QZAeuZAI9aXpvVMI+MA/JnFzTqNCxAWA29xz9D96hhXoPE7/uyqajN8Zozq/8ykIdcQrzcZGi2D4z5bTY8MU/AukikcUm0hE9SSUIKCf93ENSOzOPg04qcjHsLFMBR6hboMQTp3R6tMzbAl7FDF4w15BUWdR/NGioA8ZLRzdLoWueZ0vMbLq4EXife2Jtz0tAwzbOk7lfvBlIyohye7Takd5IpCRE375ooh7DefZQIsJU6Z7Qec9bUpaGVVwKk+ikUipQZ9vgm0veX1tM5BmLmQseBJbECLNDmA7C4QdoRvk7ayHGmThw3QzmoiBrp77xxFLLY5Ldl+m7mK1LsweQr/QnrcRJYkkfqcFzD4gSmXNF+rC3tRYrJImLBwqubSNXRT4vGsxhtmQN/+rHqJt29MQ=="},{"id":"o3","title":"Where the original budget came from","text":"XYFrifSdRbAw+V8QVHNr8pzQnG+djmBT+eXqLx6JA9Ba8zbD9bwXQjIX9T8RMsSF8DlOGK8xaP2bPCxh3M31t5brxVVUzHHCETS2H/syqJF+hJje4r2tWxglBuKPd6PUGq9jPM+5pMOsw0yDsY+20RqKtQRxV7xQZoDFd4KbDd0yoCHGlwWLIxdsGshA9SDsUW2o4zGb4flNbZF+aDytIP0I7+f4oM0rq61cLvtMEJEyYw4mqM7A8AyGpBqraRaKAi8h48Vtf/d+3uryeIGDK4SHhGvUAiZ135cdS8YrH76BuyUpRZXySCEYIt8srT7WiokJnM+gJi6AA1sSvpnzo9g4TBMYyqe+2da2Hc0kwANsxg=="}]}]},{"id":"C","label":"Role C","dept":"Production & Installation","characters":[{"id":"goran","name":"Goran Mijatović","title":"Signage Fabrication Manager","subject":"Something you should know before this is locked in","email":"Before the digital fixture order is finalised, I want to flag something from the supplier's own documentation. The digital display units we're specifying have a known failure rate in humid, coastal conditions — exactly what we have here — and the replacement lead time from the supplier runs several weeks. That's manageable if we have spares in place and a maintenance plan, but I haven't seen either confirmed yet. I can still switch suppliers or specifications at this stage, but that window is closing fast — once fixtures are ordered, that's effectively locked in. I don't know if the current bespoke fixture shapes Studio Bruhn designed are actually finalised on their end or still flexible, and that matters a lot for what I can realistically do here.\n\nTwo facts for the record. Everything at the transfer junction is installed exactly as drawn — I checked it myself on Monday. And if we switched the wayfinding to printed panels, I could still deliver the whole terminal in five weeks, artwork changes included. I can give you one more piece of the picture. Choose well.","offers":[{"id":"o1","title":"What spares and maintenance would really cost","text":"dWanRAresWHJ+Mkeely7C1NjNBYJomQpccxZmX2NMt1zWLBlxatFhYOtn6QErAVKrVAbZ0C8EQTTfBJRVIVu4C8f9I/htXrsAKLd3ejyTRVO4coTCn3EFOnwtf9tATer/3RJidQ0xr7I9P5+T+DLMAtbhcx9JMm2KLuAoNXMFo4XoxyspSrQfzYGZDCY3OEnnZeNT1pDKEwZ/su4gjFoPF2reHQX9pdmanNYGI0Esu4xd9SHnWtu8vGzXv5/pVGiCu7GyJOuZ7vEVxYLC4cumv8Aez+9/ts2fWFFKeIAoB2/n09fPcjTCo/03QxIAAGDucYL8eBEUwHGTTnyaUnjS/1InTGrDZuvjdcJG+jN42kq4BxjPLpGtdQbfSIPPnUNYUzMRJ+TpSN5uoY="},{"id":"o2","title":"The supplier's real reliability numbers","text":"iQ9k9RREYaYZc3gmiaKucn8qbCBpr10Dix1wFlRh8mK1Lt5y3E6fRbZlMTc+NdoYkgQuSaLyHs6D8brD2Im/W8XDbzTFLRDmUPLF1YeL3ejedTv0gMFQ6ZfGZGL8cGT72DY8WACw76s80aZ/F5g3AAPf+2HQ5B5IedLt6KTDNWuG6ciJmDsPtgYnmZaeZKyh5EmiE3QrwKf5r4Ze4zkqgkXvyVbVvEy4EWFmm++8NdhFX03dWC2EM3yyu7Al6x4yevVCau5+1SitAA5c6r1mFnv9ZVZ7NLY7AAVFyiwODsVkF5O4ooO7qCjab2Du5aOhPeU+i0RQnrYIR2LdYVOuYmOa8oYWNsByz644CSk4FVbLmn361y5owIYmgain6/0CyQrPFi7gbBMjxEFCXywxsYLi5wIn/Y3o260vEyHzrFkK9xrIJvyIl7aerh2qtQ=="},{"id":"o3","title":"How the bespoke fixtures are made","text":"vDJgIkfvKmt37ZyarnlhJbzJrN+tx/yCz3lbQp+fFLDrhkiu4dKehKdah+T3b1W2pyO9UdeA06bTbQFVDBhAInGRw2nGGKrT5w+cAG/YGDDXSxUZ6WriBT24ZapAA34UDX6uGbeYAnIIzzB3pVgfI3iPi0Jh4kLGX/9efvCNGq5nIx0R+ohbvsD9YLGhXUfjhDz0CPXqF9RsIYEW8sqsxftQPmLSzQMaJYwFnqt8DxxphIftmWw30C/u6bIEqA4PLqivXKKrfPRAcHcnQRDZR94jabwbnN3YFA8zww6EQGuyRHKQp6KmuP+FEkRhJdDJuHXsX+BgVsfs6VFoVIzVY7vTejmofU9fo5TYkPCJCa/G"}]},{"id":"ivana","name":"Ivana Stanišić","title":"Safety & Emergency Signage Officer","subject":"Emergency signage isn't part of this design conversation","email":"I want to make sure this doesn't get lost in the wayfinding discussion: emergency evacuation signage follows a fixed international regulatory format — specific colours, specific pictograms, specific placement rules — and none of that can be restyled to match the terminal's bold visual identity. It's a separate, legally mandated system and it has to stay clearly distinct from the general wayfinding, precisely so people can tell the difference in an actual emergency. This isn't in tension with the creative concept — the two systems are allowed to coexist — but I do need to know whether the accessibility testing that's been happening covered emergency signage specifically, or only general wayfinding, because if it's only the latter, emergency signage hasn't actually been tested at all yet, and that's a gap someone needs to know about.\n\nOne date I can confirm, because my safety sign-off happens at the same visit: the accessibility certification inspection is booked for eight weeks from now — one week before the delegation arrives — and that booking cannot slip. I can give you one more thing before you decide — choose carefully.","offers":[{"id":"o1","title":"Where the current plans break the rules","text":"hj2MDbW3KdWFAIVCQaRDtDZkGoAR9NmQiT1COJZE7U9JZVI6N70LFgqZqERju2VmgCNQ9H10mFfNHVkwtMYZM20wtd2ONYnio2FXRvL3WMCyF5WYDLDEZuj9yYfN7WCDq6NONE/HLUaB2VtYwzaBEkQGUFn6amo1D+x/997O6uBkZTzdzlseohimdi/KancGoYZ5dd93+Y0UKvmPtuw7Kuo4vbLPPZgl/Dt8cquLv8uaPKiiuIwDdd6Feo8XG+XmASBMavHacjIFhuU4bOTC0Dj4gBH/FM6A56R18VoNTtVM2jvvR8MFmWtb2l9Ri0EMauKASggD1N/CyQspDMZ6hFvBuivwo9Dxji7KPHWR6/3wgZd9RLPLOVNVecR8udNsXV9mRjn3Xg0c782GkjY2AU0oppaQlphuvqe/aLMsOTvhEI7V8zwGMyKLymaN8ORYyoT2/ICD2CuIJbykhR2atFbn8schcA5sXogeEiP81Fs="},{"id":"o2","title":"Why the two systems must stay separate","text":"NITLfyKuqaPdCyt0tLE7yPLERg6pqhFxv0DeZ1aIoNTrRAKufYE1JgCul/7FL4sikcqcRBiFlov62uQS/41Ms4S4Qptb6cOAKs7MKBr7VE+aSBZpwxOVm7ypmu3pRu2CHyVVQX/ltqJUzH0bJTtheVKmgLFgsBRzv6wKJ86d+aMYEo28pFcbrQ9Y0Q3TkcH1Wd3ObQAlkd4BS+9NzO5W90PzTm5aKhubqUNVlE/qCKSbFdZHMFBJSD/5kBbsnObIe8bKgderrHzHNT6RM2Ec65mYBxqPkxC9PMeaWIPF3Db6jQWwc0XKh8os1vkLR6OZnQTlGa3I9q0PEcOUIzXi9ZuJsGX7TK0jRzKmaDLJsdCk8EAKEw=="},{"id":"o3","title":"What the regulation actually requires","text":"/koCqhmKdDbQxjJYyy567lGNOYjCUsjib9LaoHk6otdubUH5Q9bFBt53/ifisAPDTtd0swNX8g75YCapucUFUHwCSfjAKpeITb8/lZigjMH0fCzg7m8CuLLW2VQ1NsiTAeOwZFNJPl8ndShwv19YsCYYDiaRsIE4Q1q5/DURqQuWvARPdflDV9ZNJj/lkcSSHbFixHVc0F8MVdpCgDVHKohuT7Gd3ephe/IQAoy5CUFErMq8wgvqvUxkZg015iBHqmLaWQeAaSk5bwlbTdWYz6+ftYJ9D1U4w95PP8lKAr5rayj0oqfX1lETFUheGkNsG0mNqW8b0QDG+IL1AeNdP/NpUm8Mc7st2I3kWo9eb5NTjZF2rfVI/4thGNupIS4UYpOsdKX+Hy3bthix/ADwQGnuT0af+W8Xxv3lAgVYsOCW/Wh2feFnK90TJHWpA4Dtvw=="}]},{"id":"filip","name":"Filip Nikolić","title":"Project Sponsor, Ministry of Transport","subject":"Being straight with you about the date","email":"I want to be straightforward with everyone about the delegation's visit date: it's confirmed with Brussels and it isn't moving, for reasons well above my pay grade. What I can control is what \"ready\" actually means by that date. I'd rather the terminal open a little rough with honest signage that works than open picture-perfect and confuse the one group of visitors we most need to impress. So my real question isn't whether we can hit the date — we will hit the date regardless — it's whether whatever we launch will actually have been tested with real passengers first, or whether we're planning to find out how it performs on the day itself, in front of the delegation. I genuinely don't know the answer to that yet, and I'd rather know now than be surprised.\n\nI can tell you one more thing before you decide. Choose wisely.","offers":[{"id":"o1","title":"What 'ready' means to the minister","text":"kUTx+kxwk0bcFm+7UDplJCye32lAunKwkLtEjuayebSxYR85zRsj7OUNavlFL96iz/4qmp7JUabqbqjPEBVSuKpSaYyCz+12X5P1caZddirYgtQhMNOs9aO/qiNGG+6yI/e/zyERnlGkMw2IyaTGTBi29JH4sHSEujDVH5T0fXGv/wBnZsrW6uh2XZmJ6MG6XS/U2edHsh2oG2bGXP5hwJXb7Pnn/DbOzbDG3ZU4P1DkAYqjYJHqJMuEBNy5QwIgkSPhjV1kxk2f+IQg5Xc+ubh0KW+vlddelKJpA7HRjdwPL3bV/hKGAJhJeWW+U9DiwW0f6pNx5xFjl/qJN/RNN/C95BE5QpWYiEbxmRpbMbWQf/uOmYvZCtBitJfzQunmgmsl4W5QxA=="},{"id":"o2","title":"How flexible the visit really is","text":"amLcSxtJ8jk6WFrCGgkpmlDJq0ZniJk2q+331knd9vyiNMb3qu2zbyHSeGthOdT1R+AHuvD3tNdSEV69r3m9ZsP28aCsFzt2CA5T0oGDrpFTdPKZ5cdLfDfXbieqb7iqjdyw+PAiVYc3xf7crNGKnHZJ1JTV8qj2ZoI2z7am4flWloh4AJTLN1va2k6f60MUVlou+SZtX4GQLbFXla1TWLLFvD3QkfAGWACcKZR9X0Udwj3+/4FI/YakwVODDFg2EZdJasLZd+OwJIWccJJpVRTm8wryiJmjFUkoCRjatmA6j9Bd9dOgb4Jf/8 2+TSNdFYob5KK07yIQf0frzL6FtgLEgiuTjVYMHwD+Gpbxa6qg2Stb7bgv6j+gr4NpOhzpmwTGtlm40ZMgQYnuezGau4lNXkVBFDzpm8lAdwZ1WlP+uJsTi+1Lolhq2Mmauv9IgGtLHEhVXE7dQtuNmyt14W9LsWOxIxdZsHMhTL0+Ay42fR0Lbi+rO0QQjdXT0z7vX0RLWbIUs3gSD9/tzBxE0+qbRplWNVZECZ+OfCX+j//kc4uICV7YrktSSoiGQFHklsXKR5fBydaj2JZs8wtShdcEhp8Io/zQDc8Vry9EFN+x7jyG6cSKxXTxoQgq1OkBJIa4eeuKflsOs1iqkmizWYCWb537pJcYsJApfnnNuTbqE2HTFXEnuCVRMznzkH+k2zkny/A6jFfK3gP/LEqrhRoqNzOJkiYmyyhnrcBL/P9EeN3nDwezmfS/2rwkR9B1PgK6jrqnhtdsldfh9BbTGnF5nUYuYsX4tK8+T5qU4OGYjB6dR9O0542WPFU9aZ8Kh2McXkhjzPhTD6Uv0oy4EOJtQ2YtM5XHG1WT5Lciak3qpOE5nsFf71O9COWol1pttEOAmq3fHsy6OzCl3poCocLKzQJgCLOkkf","writing":{"type":"rationale","label":"design rationale","addressee":"Thomas Voss, Creative Director, Studio Bruhn","words":320,"instructions":["State a clear position on each design decision — not just what you chose, but why","Use evidence from your contacts and your teammates: test results, costs, the building, the deadline","Acknowledge what Studio Bruhn may lose and answer the strongest objection to your choices","Write for a creative director: respectful of the design, honest about the risks"]},"two_player":{"roles":[{"id":"P1","label":"Player 1","dept":"","characters":["jonas","ana","milena","ivana"]},{"id":"P2","label":"Player 2","dept":"","characters":["elira","petar","sanja","goran","filip"]}]},"teacher_url":"https://teacher.lite.simlearn.online/","salt":"6a39a327","lc":"QZXXPkQ0vUSH0O4AIaLAduSUSApaEiijP8ilA/Osc6JToauua1F/2im0VFIQunw2ZxE="}</script>
<script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
let st = {mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:""};
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function words(t){ return (t.trim().match(/\S+/g) || []).length; }
const CHAR = Object.fromEntries(S.roles.flatMap(r => r.characters.map(c => [c.id, c])));
const TWO = S.two_player ? S.two_player.roles.map(r => ({...r, characters: r.characters.map(id => CHAR[id])})) : null;
const roles = () => (st.mode === "2" && TWO) ? TWO : S.roles;
const role = () => roles().find(r => r.id === st.role);
const pair = () => st.mode === "2";
const num = n => ["zero","one","two","three","four","five","six"][n] || String(n);
const roleName = r => r.dept ? `${r.label} — ${r.dept}` : r.label;
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}
const norm = t => t.replace(/\s+/g, " ").trim();

/* ---------- the top bar: same place on every screen ---------- */
function teacherLink(){
  return S.teacher_url ? `<a class="teacher" href="${esc(S.teacher_url.replace(/\/?$/, "/") + "?sim=" + encodeURIComponent(S.id))}" target="_blank" rel="noopener" title="Opens the teacher tool (password needed)">Teacher</a>` : "";
}
function topBar(who){
  return `<div class="wrap"><span class="title">${esc(S.title)}</span><span class="right">${who ? `<span class="who">${esc(who)}</span>` : ""}${teacherLink()}</span></div>`;
}

/* ---------- start screen ---------- */
function renderStart(){
  const two = st.mode === "2" && TWO;
  $("#app").innerHTML = `
  <header class="bar">${topBar("")}</header>
  <div class="wrap start">
    <h1>${esc(S.title)}</h1>
    <p class="lede">You work at ${esc(S.org)}. Your ${two ? "team of two" : "group"} has to make ${num(S.decisions.length)} decisions — and each of you holds information the other${two ? "" : "s"} ${two ? "doesn't" : "don't"} have.</p>
    <form id="startForm">
      <fieldset><legend>${two ? "Which player are you?" : "Your role"}</legend>
        <p class="muted small">${two ? "Decide between you who is Player 1 and who is Player 2." : "Agree in your group who takes which role. If there are more than three of you, two people can share a role."}</p>
        <div class="choices">${roles().map(r => `
          <label class="choice"><input type="radio" name="role" value="${r.id}" ${st.role===r.id?"checked":""}>
            <span><b>${esc(roleName(r))}</b><br><span class="muted small">Your contacts: ${r.characters.map(c => esc(c.name)).join(", ")}</span></span></label>`).join("")}
        </div></fieldset>
      <button type="button" class="btn" id="go" disabled>Start</button>
    </form>
    ${TWO ? `<p class="switch">${two
        ? `Three or more of you? <button type="button" class="linkish" id="mode">Switch to the group version</button>`
        : `Only two of you? <button type="button" class="linkish" id="mode">Switch to the two-player version</button>`}</p>` : ""}
    <p class="muted small" style="margin-top:2rem">${esc(S.disclaimer)}</p>
  </div>`;
  const m = $("#mode");
  if (m) m.onclick = () => { st.mode = two ? "3" : "2"; st.role = null; save(); renderStart(); };
  const f = $("#startForm");
  const upd = () => { $("#go").disabled = !f.querySelector("input[name=role]:checked"); };
  f.addEventListener("change", upd); upd();
  f.addEventListener("submit", e => e.preventDefault());
  $("#go").addEventListener("click", () => {
    const r = f.querySelector("input[name=role]:checked");
    if (!r) return;
    st.role = r.value; st.tab = "context"; save(); render(); window.scrollTo(0,0);
  });
}

/* ---------- main shell ---------- */
const TABS = [["context","Context"],["firstlook","First look"],["listening","Listening"],["inbox","Inbox"],["decisions","Decisions"],["submit","Write & submit"]];
function render(){
  if (!st.role) return renderStart();
  const r = role();
  const pending = r.characters.filter(c => !st.choices[c.id]).length;
  $("#app").innerHTML = `
  <header class="bar">${topBar(r.dept ? r.label + " · " + r.dept : r.label)}
    <div class="wrap"><nav class="tabs" role="tablist">${TABS.map(([k,l]) => `<button type="button" class="tab" role="tab" data-tab="${k}" aria-selected="${st.tab===k}">${l}${k==="inbox"&&pending?`<span class="dot" title="${pending} choice(s) still open"></span>`:""}</button>`).join("")}</nav></div></header>
  <main class="wrap" id="main"></main>
  <footer class="wrap">${esc(S.disclaimer)}<br>Nothing you type here leaves this browser tab unless you copy it yourself.
    <button type="button" class="linkish" id="reset">Start again (choose a new role)</button>
    <span id="resetAsk" hidden> This clears everything you've done, including your text. <button type="button" class="linkish" id="resetYes">Yes, clear it</button> · <button type="button" class="linkish" id="resetNo">Keep my work</button></span></footer>`;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { st.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0); });
  $("#reset").onclick = () => { $("#resetAsk").hidden = false; $("#reset").hidden = true; };
  $("#resetNo").onclick = () => { $("#resetAsk").hidden = true; $("#reset").hidden = false; };
  $("#resetYes").onclick = () => {
    try { sessionStorage.removeItem(STORE); } catch(e) {}
    st = {mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:""};
    pendingPick = {}; render(); window.scrollTo(0,0);
  };
  ({context:tabContext, firstlook:tabFirstLook, listening:tabListening, inbox:tabInbox, decisions:tabDecisions, submit:tabSubmit})[st.tab]();
}

/* ---------- tabs ---------- */
function tabContext(){
  const c = S.context;
  $("#main").innerHTML = `
    ${S.image ? `<figure class="hero"><img src="${S.image.src}" alt="${esc(S.image.alt)}"></figure>` : ""}
    <div class="prose">${c.text.split("\n\n").map(p => `<p>${esc(p)}</p>`).join("")}</div>
    <div class="note scar"><b>${esc(c.scar.label)}</b><p class="prose">${esc(c.scar.text)}</p></div>
    <div class="note proof"><b>${esc(c.proof.label)}</b><p class="prose">${esc(c.proof.text)}</p></div>
    <div class="note clock"><b>The clock</b><p class="prose">${esc(c.constraint)}</p></div>
    <h2>Who knows what</h2>
    <p class="muted">You only see your own contacts. What the others know reaches you by talking to ${st.mode === "2" ? "your partner" : "your group"}.</p>
    <div class="contacts">${roles().map(r => `<div><b>${esc(roleName(r))}</b>${r.id===st.role?" (you)":""}<br><span class="muted">${r.characters.map(ch => `${esc(ch.name)}, ${esc(ch.title)}`).join(" · ")}</span></div>`).join("")}</div>`;
}

function tabFirstLook(){
  $("#main").innerHTML = `
    <p>Before you read anything else, go with your gut. Nobody sees these answers — they're for ${pair() ? "talking with your partner" : "your group discussion"}.</p>
    ${S.decisions.map(d => `
      <div class="dec"><h3>${esc(d.title)}</h3>
        ${["A","B","Unsure"].map(o => `<label class="opt"><input type="radio" name="fl_${d.id}" value="${o}" ${st.firstLook[d.id]===o?"checked":""}>
          <span>${o==="Unsure" ? "<i>Not sure yet</i>" : `<b>${o}.</b> ${esc(d[o])}`}</span></label>`).join("")}
      </div>`).join("")}
    <p><b>Discuss:</b> Where do you disagree? Which decision feels hardest right now, and why?</p>`;
  $("#main").onchange = e => { const [, id] = e.target.name.split("_"); st.firstLook[id] = e.target.value; save(); };
}

function listeningAnswers(){
  try { return S.lc ? JSON.parse(unscramble(S.lc, `${S.salt}|listening`)) : null; } catch(e) { return null; }
}
function tabListening(){
  const L = S.listening, key = listeningAnswers(), done = !!(st.mcqDone && key);
  const n = L.questions.length, right = done ? L.questions.filter((q,i) => st.mcq[i] === key[i]).length : 0;
  $("#main").innerHTML = `
    <p>Your teacher will play <b>${esc(L.name)}</b>. Answer while you listen${key ? ", then press <b>Check my answers</b>" : " — your teacher will go through the answers afterwards"}.</p>
    ${L.questions.map((q,i) => `<div class="mcq"><b>${i+1}. ${esc(q.q)}</b>
      ${Object.entries(q.options).map(([k,v]) => {
        const cls = !done ? "" : (k === key[i] ? "right" : (st.mcq[i] === k ? "wrong" : ""));
        return `<label class="${cls}"><input type="radio" name="mcq_${i}" value="${k}" ${st.mcq[i]===k?"checked":""} ${done?"disabled":""}><span>${k}: ${esc(v)}</span></label>`;
      }).join("")}
      ${done ? (st.mcq[i] === key[i] ? `<p class="res ok">✓ Correct</p>` : `<p class="res no">✗ ${st.mcq[i] ? "Not quite" : "No answer"} — the answer is ${key[i]}</p>`) : ""}</div>`).join("")}
    ${!key ? "" : done
      ? `<div class="score">You got ${right} of ${n} right.</div>`
      : `<p style="margin-top:18px"><button type="button" class="btn" id="checkL">Check my answers</button>
           <span class="muted small">You can't change your answers afterwards.</span></p><p id="checkMsg" class="small" aria-live="polite"></p>`}`;
  if (done) return;
  $("#main").onchange = e => { if (e.target.name && e.target.name.startsWith("mcq_")) { st.mcq[e.target.name.split("_")[1]] = e.target.value; save(); } };
  const b = $("#checkL");
  if (b) b.onclick = () => {
    const missing = L.questions.map((q,i) => st.mcq[i] ? null : i+1).filter(Boolean);
    if (missing.length && !b.dataset.sure) {
      $("#checkMsg").textContent = `You haven't answered question${missing.length>1?"s":""} ${missing.join(", ")}. Press the button again to check anyway.`;
      b.dataset.sure = "1"; return;
    }
    st.mcqDone = true; save(); tabListening();
  };
}

let pendingPick = {};   // cid -> offer id, chosen but not yet confirmed
function tabInbox(){
  const r = role();
  $("#main").innerHTML = `
    <p>Each contact will tell you <b>one more thing</b> — you choose what. All three are useful, but some matter much more than others — and what matters most often depends on what ${pair() ? "your partner's" : "your teammates'"} contacts know. <b>Talk to ${pair() ? "your partner" : "your group"} before you choose.</b> Your choice is final.</p>
    ${r.characters.map(c => mailHTML(c)).join("")}`;
  r.characters.forEach(c => wireMail(c));
}
function mailHTML(c){
  const chosen = st.choices[c.id];
  const open = !chosen;
  let offers;
  if (chosen) {
    const o = c.offers.find(x => x.id === chosen);
    offers = `<div class="offers done">
        <div class="opened"><p class="t">${esc(o.title)}</p><div class="prose">${esc(unscramble(o.text, `${S.salt}|${c.id}|${o.id}`))}</div></div>
        ${c.offers.filter(x => x.id !== chosen).map(x => `<div class="offer closed" aria-disabled="true">${esc(x.title)}</div>`).join("")}
      </div>`;
  } else {
    const pick = pendingPick[c.id];
    offers = `<div class="offers"><p class="ask">${esc(c.name.split(" ")[0])} can tell you one more thing. Which do you want to know?</p>
      ${c.offers.map(o => `<button type="button" class="offer" data-c="${c.id}" data-o="${o.id}" aria-pressed="${pick===o.id}">${esc(o.title)}</button>`).join("")}
      ${pick ? `<div class="confirm"><button type="button" class="btn" data-confirm="${c.id}">Ask about this</button><span class="muted small">You can't change this afterwards.</span></div>` : ""}
    </div>`;
  }
  return `<details class="mail" id="m_${c.id}" ${open || st.tab==="inbox" ? "open" : ""}>
    <summary><span><span class="from">${esc(c.name)}</span>, <span class="muted">${esc(c.title)}</span><br><span class="subj">${esc(c.subject)}</span></span>
      <span class="state ${chosen?"":"todo"}">${chosen ? "Answered" : "Choose one"}</span></summary>
    <div class="body"><div class="prose">${esc(c.email)}</div>${offers}</div></details>`;
}
function wireMail(c){
  const box = $("#m_" + c.id);
  box.querySelectorAll(".offer[data-o]").forEach(b => b.onclick = () => { pendingPick[c.id] = b.dataset.o; rerenderMail(c); });
  const cf = box.querySelector("[data-confirm]");
  if (cf) cf.onclick = () => { st.choices[c.id] = pendingPick[c.id]; delete pendingPick[c.id]; save(); rerenderMail(c); updateDot(); };
}
function rerenderMail(c){
  const old = $("#m_" + c.id); const tmp = document.createElement("div"); tmp.innerHTML = mailHTML(c);
  old.replaceWith(tmp.firstElementChild); wireMail(c);
  const btn = $("#m_" + c.id + " [data-confirm]"); if (btn) btn.focus();
}
function updateDot(){ const pending = role().characters.filter(c => !st.choices[c.id]).length; const t = document.querySelector('.tab[data-tab="inbox"] .dot'); if (t && !pending) t.remove(); }

function tabDecisions(){
  const all = S.decisions.every(d => st.decisions[d.id]);
  $("#main").innerHTML = `
    <p>Agree the ${num(S.decisions.length)} decisions <b>${pair() ? "together" : "as a group"}</b>, then ${pair() ? "both of you enter" : "everyone enters"} the same answers here. For each one, note the biggest risk or objection — you'll need it in your writing.</p>
    ${S.decisions.map(d => `
      <div class="dec"><h3>${esc(d.title)}</h3>
        ${["A","B"].map(o => `<label class="opt"><input type="radio" name="dec_${d.id}" value="${o}" ${st.decisions[d.id]===o?"checked":""}><span><b>${o}.</b> ${esc(d[o])}</span></label>`).join("")}
        <label class="small muted" for="hw_${d.id}">However… (the main risk or objection)</label>
        <textarea id="hw_${d.id}" data-hw="${d.id}">${esc(st.however[d.id]||"")}</textarea>
      </div>`).join("")}
    ${all ? `<div class="flash"><b>Breaking news</b><div class="prose">${esc(unscramble(S.newsflash, `${S.salt}|newsflash`)).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</div></div>`
          : `<p class="muted small">When you've chosen all ${num(S.decisions.length)}, some breaking news will appear here.</p>`}`;
  $("#main").onchange = e => { if (e.target.name && e.target.name.startsWith("dec_")) { st.decisions[e.target.name.slice(4)] = e.target.value; save(); render(); } };
  $("#main").oninput = e => { if (e.target.dataset.hw) { st.however[e.target.dataset.hw] = e.target.value; save(); } };
}

function tabSubmit(){
  const W = S.writing;
  $("#main").innerHTML = `
    <h2 style="margin-top:0">Your ${esc(W.label)} to ${esc(W.addressee)}</h2>
    <p>About ${W.words} words. Your ${esc(W.label)} should:</p>
    <ul>${W.instructions.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    <textarea class="memo" id="memo" placeholder="Write here. Your text is kept in this tab until you close it.">${esc(st.memo)}</textarea>
    <div class="count" id="count"></div>

    <div class="consent">
      <b>Can your teacher check your text with AI?</b>
      <p class="small">Your teacher may use the SimLearn teacher tool, which can ask an AI system (Claude, by Anthropic) to suggest feedback on your writing. Only your text and your group's choices would be sent — not your name. Your teacher always makes the final decision about your grade. If you say no, your teacher marks your text by hand. Saying no has no effect on your grade.</p>
      <label><input type="checkbox" id="consent" ${st.consent?"checked":""}> Yes, my teacher may check my text with AI.</label>
    </div>

    <div id="issues" class="issues"></div>
    <button type="button" class="btn" id="make">Create my submission</button>
    <div id="out"></div>`;
  const memo = $("#memo"), count = () => { const n = words(memo.value); $("#count").textContent = `${n} word${n===1?"":"s"}`; };
  memo.oninput = () => { st.memo = memo.value; save(); count(); }; count();
  $("#consent").onchange = e => { st.consent = e.target.checked; save(); $("#out").innerHTML = ""; };
  $("#make").onclick = makeSubmission;
}

function makeSubmission(){
  const r = role(), W = S.writing;
  const missing = [];
  const openChars = r.characters.filter(c => !st.choices[c.id]);
  if (openChars.length) missing.push(`You haven't chosen what to ask ${openChars.map(c => c.name).join(", ")} yet (Inbox).`);
  const openDec = S.decisions.filter(d => !st.decisions[d.id]);
  if (openDec.length) missing.push(`Your group's answer is missing for ${openDec.map(d => d.title.split(" — ")[0]).join(", ")} (Decisions).`);
  if (words(st.memo) < 50) missing.push("Your text is very short — write your " + W.label + " first.");
  $("#issues").innerHTML = missing.map(m => `<p>${esc(m)}</p>`).join("");
  if (openDec.length || words(st.memo) < 50) { $("#out").innerHTML = ""; return; }

  const ai = st.consent ? "yes" : "no";
  const choices = r.characters.map(c => `${c.id}=${st.choices[c.id] || "-"}`).join(", ");
  const decisions = S.decisions.map(d => `${d.id}=${st.decisions[d.id]}`).join(", ");
  const memoText = st.memo.trim();
  const code = checkCode([S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""]);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Copy everything in the box and paste it into the <b>Moodle assignment</b> your teacher has set up. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you paste it.</p>`;
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}

render();
</script>
</body>
</html>
